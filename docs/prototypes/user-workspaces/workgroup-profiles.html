<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Compass — Configuration profils · Workgroup</title><style>
:root{font:13px Inter,system-ui,'Segoe UI',sans-serif;color:#253650;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1550px;margin:auto;padding:25px 30px}h1{font-size:25px;letter-spacing:-.6px;margin:4px 0}h2{font-size:16px;margin:0}h3{font-size:13px;margin:0}.muted{color:#74849b}.small{font-size:11px}.eyebrow{letter-spacing:.12em;font-weight:800;font-size:10px;color:#8292a8;text-transform:uppercase}.top,.between{display:flex;align-items:center;justify-content:space-between;gap:12px}.top{margin-bottom:19px}.btn{background:white;color:#344966;border:1px solid #dce5ef;border-radius:9px;padding:9px 13px;font-weight:700}.btn.primary{background:#137e81;border-color:#137e81;color:white}.btn:disabled{opacity:.45;cursor:not-allowed}.seg{display:flex;background:#e9eef4;border-radius:10px;padding:4px;gap:3px}.seg button{border:0;background:transparent;border-radius:7px;padding:9px 13px;font-weight:700;color:#63768e}.seg button.active{background:#fff;color:#0c8085;box-shadow:0 1px 6px #24395715}.box{background:#fff;border:1px solid #e2e9f2;border-radius:14px;box-shadow:0 2px 13px #1c335008}.pad{padding:18px}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px}.field{width:100%;border:1px solid #d8e2ed;border-radius:9px;padding:10px 11px;background:#fff;color:#314560;outline:none}.field:focus{border-color:#168a8d;box-shadow:0 0 0 3px #148a8a18}.stack{display:grid;gap:11px}.node{width:100%;border:1px solid #e5edf4;background:#fff;text-align:left;padding:12px;border-radius:10px;margin-top:8px}.node.active{border-color:#8dcfc9;background:#effaf9}.node strong{display:block;margin-bottom:5px}.badge{display:inline-block;border-radius:999px;background:#e9f4f3;color:#1d817c;font-size:10px;font-weight:800;padding:4px 9px}.badge.gray{background:#edf1f6;color:#73839a}.badge.warn{background:#fff2db;color:#9a6719}.badge.red{background:#fcebef;color:#aa4c64}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:15px}.bar{padding:15px 18px;border-bottom:1px solid #e8edf4}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}.label{color:#74839a;font-size:11px;font-weight:750;display:block;margin-bottom:6px}.hint{font-size:11px;color:#8290a4;line-height:1.5}.rule{border:0;border-top:1px solid #edf1f6;margin:19px 0}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}.chip{background:#edf3f7;border-radius:7px;padding:6px 9px;color:#52667f;font-size:11px}.matrix{width:100%;border-collapse:separate;border-spacing:0}.matrix th,.matrix td{padding:12px;border-bottom:1px solid #edf0f5;text-align:left}.matrix th{font-size:11px;color:#657791;background:#f7f9fb;position:sticky;top:0;z-index:1}.matrix th:first-child{min-width:250px}.matrix td:not(:first-child){text-align:center}.group{border:0;background:#edf3f7;font-weight:800;text-align:left;color:#41546d;width:100%;padding:11px;border-radius:7px}.group-row td{padding:6px 10px;background:#f7f9fc}.taskrow:hover{background:#f6faf9}.check{width:17px;height:17px;accent-color:#14888a}.solution{border:1px solid #e3e9f0;border-radius:10px;padding:12px;margin:9px 0}.solution strong{display:block}.solution p{margin:7px 0;color:#708098;font-size:11px;line-height:1.5}.link{color:#127f87;cursor:pointer;background:none;border:0;padding:0;font-weight:700}.soft{padding:11px 13px;background:#f1f7f8;border:1px solid #dbeeee;border-radius:9px;color:#447b80;font-size:11px;line-height:1.5}.notice{padding:10px 13px;border-radius:9px;background:#fff6e6;color:#956a20;font-size:11px;line-height:1.5}.solution-grid{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:15px}.right-rail{background:#f9fbfd;border:1px solid #e7edf4;border-radius:10px;padding:15px;align-self:start}.overlay{position:fixed;inset:0;background:#15213975;display:none;align-items:center;justify-content:center;padding:22px;z-index:10}.overlay.show{display:flex}.modal{background:#fff;border-radius:16px;width:min(480px,100%);padding:22px;box-shadow:0 16px 80px #10253a40}.modal p{line-height:1.6}.modal .buttons{display:flex;gap:9px;justify-content:flex-end;margin-top:19px}.hidden{display:none!important}.user-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}.matrix-scroll{overflow:auto;max-height:650px}.foot{color:#8292a6;font-size:11px;margin:20px 0;text-align:center}@media(max-width:960px){.layout,.twocol,.solution-grid{grid-template-columns:1fr}.app{padding:16px}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="app"><div class="top"><div><div class="eyebrow">AI Compass / Workgroup Studio</div><h1 id="title">Configuration des profils</h1><div class="muted" id="subtitle">Workgroup · affectations et contraintes de déploiement</div></div><div class="badge">Espace Workgroup · Configuration des profils</div></div><div id="workgroup"></div><div class="foot">Prototype autonome · exemples fictifs · les droits et la disponibilité sont simulés, sans accès aux APIs Server</div></div><div class="overlay" id="overlay"><div class="modal" id="modal"></div></div><script>
const tasks=[{id:'rfq1',name:'Analyse de cahier des charges',phase:'RFQ',specialty:'Systèmes'},{id:'rfq2',name:'Chiffrage technique',phase:'RFQ',specialty:'Systèmes'},{id:'arch1',name:'Conception d’architecture logicielle',phase:'Architecture',specialty:'Logiciel'},{id:'drv1',name:'Développement de driver MCU',phase:'Développement',specialty:'Logiciel embarqué'},{id:'dev2',name:'Refactoring de composants',phase:'Développement',specialty:'Logiciel'},{id:'qa1',name:'Automatisation des tests',phase:'Qualification',specialty:'Validation'},{id:'qa2',name:'Analyse de régression',phase:'Qualification',specialty:'Logiciel embarqué'},{id:'doc1',name:'Documentation technique',phase:'Maintenance',specialty:'Systèmes'}];
const solutions=[{id:'claude',name:'Claude · Claude Code',state:'published',eligible:['drv1','arch1','dev2','qa2','doc1'],guide:'Guide d’installation Claude Code',os:['Linux','Windows','WSL']},{id:'codex',name:'GPT · Codex CLI',state:'published',eligible:['drv1','dev2','qa1','qa2'],guide:'Guide d’installation Codex',os:['Linux','WSL','Windows']},{id:'gemini',name:'Gemini · CLI',state:'published',eligible:['rfq1','rfq2','arch1','doc1'],guide:'Guide de démarrage Gemini CLI',os:['Linux','Windows','WSL']},{id:'deepseek',name:'DeepSeek · OpenCode',state:'draft',eligible:['drv1','dev2','qa1'],guide:'Guide OpenCode',os:['Linux','WSL']}];
let people=[{id:'alice',name:'Camille Martin',specialties:['Logiciel embarqué','Validation'],ide:'VS Code',os:['Linux','Windows'],wsl:true,assigned:['drv1','qa1','qa2','arch1'],available:{claude:true,codex:false}},{id:'bob',name:'Noah Dubois',specialties:['Systèmes'],ide:'IntelliJ IDEA',os:['Windows'],wsl:false,assigned:['rfq1','rfq2','doc1'],available:{gemini:true}},{id:'eva',name:'Sarah Laurent',specialties:['Logiciel','Logiciel embarqué'],ide:'Neovim',os:['Linux'],wsl:false,assigned:['drv1','dev2','arch1','doc1'],available:{claude:false,codex:true}},{id:'leo',name:'Alex Petit',specialties:['Validation'],ide:'VS Code',os:['Windows'],wsl:true,assigned:['qa1','qa2'],available:{codex:false}}];
const state={mode:'w',selected:'alice',checked:['alice'],phase:'phase',search:'',collapsed:new Set(),user:'alice',userView:'task',userGroup:'phase',userSearch:''};
const $=x=>document.querySelector(x),esc=s=>String(s??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));const person=id=>people.find(p=>p.id===id);const fit=(p,s)=>p.os.some(o=>s.os.includes(o))||(p.wsl&&s.os.includes('WSL'));const interest=(p,s)=>p.assigned.some(t=>s.eligible.includes(t));
function openModal(html){$('#modal').innerHTML=html;$('#overlay').classList.add('show')}function closeModal(){$('#overlay').classList.remove('show')}$('#overlay').onclick=e=>{if(e.target.id==='overlay')closeModal()};

function groups(items,by,content){const names=[...new Set(items.map(t=>t[by]))].sort();return names.map(n=>`<tr class="group-row"><td colspan="${content==='assign'?2:3}"><button class="group" data-expand="${esc(n)}">${state.collapsed.has(n)?'▸':'▾'} ${esc(n)} <span class="muted">· ${items.filter(t=>t[by]===n).length}</span></button></td></tr>${state.collapsed.has(n)?'':items.filter(t=>t[by]===n).map(t=>content==='assign'?`<tr class="taskrow"><td>${esc(t.name)}<div class="small muted">${esc(t.phase)} · ${esc(t.specialty)}</div></td><td style="text-align:right"><input class="check task-check" type="checkbox" data-task="${t.id}" ${state.checked.every(id=>person(id).assigned.includes(t.id))?'checked':''}></td></tr>`:'').join('')}`).join('')}
function renderW(){let p=person(state.selected),list=people.filter(x=>x.name.toLowerCase().includes((state.peopleSearch||'').toLowerCase()));$('#workgroup').innerHTML=`<div class="layout"><aside class="box"><div class="bar between"><h2>Collaborateurs</h2><span class="badge">${people.length}</span></div><div class="pad"><input id="peopleSearch" class="field" placeholder="Rechercher une personne…" value="${esc(state.peopleSearch||'')}"><p class="hint">Sélectionner plusieurs personnes pour leur attribuer les mêmes activités.</p>${list.map(u=>`<div class="node ${u.id===p.id?'active':''}" data-person="${u.id}"><label style="display:flex;gap:10px;align-items:center"><input type="checkbox" class="check person-check" data-id="${u.id}" ${state.checked.includes(u.id)?'checked':''}><span><strong>${esc(u.name)}</strong><span class="small muted">${esc(u.specialties.join(' · '))}</span></span></label></div>`).join('')}</div></aside><div class="stack"><section class="box"><div class="bar between"><div><h2>Environnement utilisateur</h2><div class="small muted">${esc(p.name)} · les changements concernent cette personne uniquement</div></div><span class="badge gray">Profil déclaratif</span></div><div class="pad"><div class="twocol"><div><label class="label">Éditeur / IDE principal</label><input id="ide" class="field" value="${esc(p.ide)}"></div><div><label class="label">Spécialité(s) métier</label><input id="spec" class="field" value="${esc(p.specialties.join(', '))}" placeholder="Séparées par une virgule"></div><div><label class="label">OS utilisables</label><div class="chips">${['Linux','Windows','macOS'].map(os=>`<label class="chip"><input type="checkbox" class="env" data-os="${os}" ${p.os.includes(os)?'checked':''}> ${os}</label>`).join('')}</div></div><div><label class="label">WSL disponible</label><label class="chip"><input id="wsl" type="checkbox" ${p.wsl?'checked':''}> Peut utiliser WSL sous Windows</label></div></div><div class="between" style="margin-top:13px"><div class="hint">Ce profil influe sur l'applicabilité des configurations, pas sur les droits déjà délivrés.</div><button class="btn primary" id="saveEnv">Enregistrer le profil</button></div></div></section><section class="box"><div class="bar between"><div><h2>Activités pertinentes</h2><div class="small muted">Affectation en lot · ${state.checked.length} personne(s) sélectionnée(s)</div></div><button class="btn primary" id="applyTasks">Appliquer à la sélection</button></div><div class="pad"><div class="toolbar"><input id="taskSearch" class="field" style="max-width:330px" placeholder="Chercher une activité…" value="${esc(state.search)}"><div class="seg"><button class="${state.phase==='phase'?'active':''}" data-cat="phase">Par phase</button><button class="${state.phase==='specialty'?'active':''}" data-cat="specialty">Par spécialité</button></div></div><div class="matrix-scroll"><table class="matrix"><thead><tr><th>Activité</th><th style="text-align:right">Attribuer</th></tr></thead><tbody>${groups(tasks.filter(t=>(t.name+' '+t.phase+' '+t.specialty).toLowerCase().includes(state.search.toLowerCase())),state.phase,'assign')}</tbody></table></div><p class="hint">Les cases affichent l'intersection des activités déjà affectées à toutes les personnes sélectionnées. « Appliquer » ajoute ou retire explicitement les activités visibles, sans toucher aux autres activités.</p></div></section></div></div>`;
$('#peopleSearch').oninput=e=>{state.peopleSearch=e.target.value;renderW()};document.querySelectorAll('[data-person]').forEach(el=>el.onclick=e=>{if(e.target.closest('input'))return;state.selected=el.dataset.person;renderW()});document.querySelectorAll('.person-check').forEach(el=>el.onchange=()=>{state.checked=Array.from(document.querySelectorAll('.person-check:checked')).map(el=>el.dataset.id);renderW()});$('#saveEnv').onclick=()=>{p.ide=$('#ide').value;p.specialties=$('#spec').value.split(',').map(x=>x.trim()).filter(Boolean);p.os=Array.from(document.querySelectorAll('.env:checked')).map(e=>e.dataset.os);p.wsl=$('#wsl').checked;renderW()};$('#taskSearch').oninput=e=>{state.search=e.target.value;renderW()};document.querySelectorAll('[data-cat]').forEach(el=>el.onclick=()=>{state.phase=el.dataset.cat;state.collapsed.clear();renderW()});document.querySelectorAll('[data-expand]').forEach(el=>el.onclick=()=>{let g=el.dataset.expand;state.collapsed.has(g)?state.collapsed.delete(g):state.collapsed.add(g);renderW()});$('#applyTasks').onclick=()=>{let selected=state.checked.map(person).filter(Boolean);if(!selected.length){alert('Sélectionner au moins une personne.');return}let items=tasks.filter(t=>(t.name+' '+t.phase+' '+t.specialty).toLowerCase().includes(state.search.toLowerCase())&&!state.collapsed.has(t[state.phase]));for(let t of items){let checked=document.querySelector(`[data-task="${t.id}"]`)?.checked;for(const x of selected){x.assigned=x.assigned.filter(a=>a!==t.id);if(checked)x.assigned.push(t.id)}}renderW()};}
function cardState(p,s){if(s.state!=='published')return ['Non publiée','gray'];if(!fit(p,s))return ['OS à adapter','warn'];if(p.available[s.id])return ['Disponible',''];return ['Accès à valider','warn']}
function renderU(){const p=person(state.user);let assigned=tasks.filter(t=>p.assigned.includes(t.id)&&(t.name+' '+t.phase+' '+t.specialty).toLowerCase().includes(state.userSearch.toLowerCase()));let nav=`<div class="bar between"><div><h2>Mes activités et solutions</h2><div class="small muted">Préselection de tâches liée au profil · solutions publiées</div></div><span class="badge">${assigned.length} activités</span></div><div class="pad"><div class="toolbar"><input id="userSearch" class="field" style="max-width:320px" placeholder="Chercher dans mes activités et outils…" value="${esc(state.userSearch)}"><div class="seg"><button data-us="task" class="${state.userView==='task'?'active':''}">Par activité</button><button data-us="tool" class="${state.userView==='tool'?'active':''}">Par outil</button></div><select class="field" id="userGroup" style="max-width:170px"><option value="phase" ${state.userGroup==='phase'?'selected':''}>Phase projet</option><option value="specialty" ${state.userGroup==='specialty'?'selected':''}>Spécialité</option></select></div><div id="userList"></div><div class="soft" style="margin-top:16px">Tu peux consulter les guides des solutions disponibles, confirmer ton accès et proposer un retour d'expérience ou un nouveau besoin. Aucun Forecast théorique n'est présenté comme outil déjà validé.</div></div>`;$('#user').innerHTML=`<div class="stack"><section class="box"><div class="bar between"><div><h2>Bienvenue, ${esc(p.name.split(' ')[0])}</h2><span class="muted small">Ta page d'accueil IA · outils et activités adaptés à ton profil</span></div><select id="identity" class="field" style="max-width:205px" title="Personne simulée (démo)">${people.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="pad between"><div><div class="chips">${p.specialties.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}<span class="chip">${esc(p.ide)}</span>${p.os.map(x=>`<span class="chip">${x}</span>`).join('')}${p.wsl?'<span class="chip">WSL</span>':''}</div><div class="hint">Ces informations sont configurées par le Workgroup. Les demandes de droits restent distinctes des autorisations IA Compass.</div></div><button class="btn" id="request">Signaler un besoin</button></div></section><section class="box">${nav}</section></div>`;$('#identity').onchange=e=>{state.user=e.target.value;renderU()};$('#request').onclick=()=>openModal(`<h2>Proposer un besoin</h2><p class="muted">Point d’entrée vers Needs & Feedback. Les données ne sont pas envoyées dans cette maquette.</p><input class="field" placeholder="Quelle activité voudrais-tu améliorer ?"><div class="buttons"><button class="btn" onclick="closeModal()">Fermer</button></div>`);$('#userSearch').oninput=e=>{state.userSearch=e.target.value;renderU()};$('#userGroup').onchange=e=>{state.userGroup=e.target.value;renderU()};document.querySelectorAll('[data-us]').forEach(e=>e.onclick=()=>{state.userView=e.dataset.us;renderU()});const list=$('#userList');if(state.userView==='task'){let grouped={};for(const t of assigned)(grouped[t[state.userGroup]]??=[]).push(t);list.innerHTML=Object.entries(grouped).map(([g,arr])=>`<div style="margin-bottom:16px"><button class="group" data-u-expand="${esc(g)}">${state.collapsed.has('u'+g)?'▸':'▾'} ${esc(g)} · ${arr.length}</button>${state.collapsed.has('u'+g)?'':arr.map(t=>`<div class="solution"><strong>${esc(t.name)}</strong><div class="chips">${solutions.filter(s=>s.eligible.includes(t.id)&&s.state==='published').map(s=>{let st=cardState(p,s);return `<button class="btn" style="font-size:11px" data-solution="${s.id}">${esc(s.name)} · ${st[0]}</button>`}).join('')||'<span class="muted small">Aucune solution publiée adaptée pour le moment</span>'}</div></div>`).join('')}</div>`).join('')||'<div class="pad muted">Aucune activité correspondant à la recherche.</div>'}else{let arr=solutions.filter(s=>s.state==='published'&&assigned.some(t=>s.eligible.includes(t.id)));list.innerHTML=arr.map(s=>{let st=cardState(p,s);return `<div class="solution"><div class="between"><strong>${esc(s.name)}</strong><span class="badge ${st[1]}">${st[0]}</span></div><p>Activités : ${assigned.filter(t=>s.eligible.includes(t.id)).map(t=>t.name).join(' · ')}</p><button class="link" data-solution="${s.id}">Voir ma solution →</button></div>`}).join('')||'<div class="pad muted">Aucune solution correspondante.</div>'}document.querySelectorAll('[data-u-expand]').forEach(el=>el.onclick=()=>{let k='u'+el.dataset.uExpand;state.collapsed.has(k)?state.collapsed.delete(k):state.collapsed.add(k);renderU()});document.querySelectorAll('[data-solution]').forEach(el=>el.onclick=()=>solutionModal(p,solutions.find(s=>s.id===el.dataset.solution)))}
function solutionModal(p,s){let st=cardState(p,s);openModal(`<div class="between"><h2>${esc(s.name)}</h2><span class="badge ${st[1]}">${st[0]}</span></div><p class="muted">${esc(s.guide)} · Compatible : ${s.os.join(', ')}</p><div class="soft">Publication Workgroup : ${s.state==='published'?'publiée':'non publiée'}. Environnement déclaré : ${esc(p.os.join(', '))}${p.wsl?', WSL autorisé':''}.</div><h3 style="margin-top:20px">Mon accès personnel</h3><p>Si cette solution est installée et utilisable, tu peux confirmer son accès. Cela ne remplace pas les vérifications de licences faites par l’équipe de déploiement.</p><label style="display:flex;gap:9px;align-items:center"><input class="check" id="confirmed" type="checkbox" ${p.available[s.id]?'checked':''} ${s.state!=='published'||!fit(p,s)?'disabled':''}> Installation et accès testés sur mon environnement</label><div class="buttons"><button class="btn" id="cancel">Fermer</button><button class="btn primary" id="confirm" ${s.state!=='published'||!fit(p,s)?'disabled':''}>Enregistrer</button></div>`);$('#cancel').onclick=closeModal;$('#confirm').onclick=()=>{p.available[s.id]=$('#confirmed').checked;closeModal();renderU()}}
function render(){if(state.mode==='w')renderW();else renderU()}render();
</script></body></html>
