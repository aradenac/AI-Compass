n-items:center;justify-content:center;padding:20px;z-index:10}.modal{background:white;border-radius:16px;padding:23px;width:min(610px,95vw);max-height:90vh;overflow:auto;box-shadow:0 15px 60px #0a142c44}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid label{display:flex;flex-direction:column;gap:6px;color:#65758c;font-size:12px;font-weight:650}.formgrid label.full{grid-column:1/-1}.formgrid input,.formgrid select,.formgrid textarea{width:100%}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:19px}.empty{text-align:center;padding:70px 20px;color:#7a889b}.stack{display:grid;gap:14px}.checkrow{display:flex;gap:9px;align-items:center;padding:7px 0}.compact{padding:12px 16px}.right{text-align:right}@media(max-width:1060px){.shell{padding:20px}.board{grid-template-columns:repeat(2,minmax(260px,1fr))}.info-grid{grid-template-columns:1fr}}@media(max-width:650px){.board{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}.run{grid-template-columns:1fr 1fr}.filters .count{width:100%}.formgrid{grid-template-columns:1fr}}

const seed=[
{id:'cmp-ethernet',name:'Driver Ethernet KSZ8851SNL',objective:'Comparer les configurations IA sur l’implémentation, le diagnostic et la robustesse du driver Ethernet.',status:'in_progress',mode:'task_centred',owner:'Camille Bernard',updated:'14 oct. 2026',tasks:['Driver KSZ8851SNL'],tests:['TC-101','TC-102','TC-103'],solutions:['Claude + Claude Code','DeepSeek + OpenCode'],runs:[{id:'RUN-041',tc:'TC-101',solution:'Claude + Claude Code',result:'Validé',date:'12 oct.',quality:87},{id:'RUN-042',tc:'TC-102',solution:'DeepSeek + OpenCode',result:'Échec DoD',date:'13 oct.',quality:48}],review:'',notes:'Tester sur un dépôt Zephyr et vérifier les régressions.'},

{id:'cmp-ci',name:'Optimisation de CI embarquée',objective:'Évaluer la réduction de durée CI à qualité constante.',status:'planned',mode:'solution_centred',owner:'Camille Bernard',updated:'11 oct. 2026',tasks:['Optimisation CI'],tests:['TC-301'],solutions:['DeepSeek + OpenCode'],runs:[],review:'',notes:'Contrôler la couverture tests.'},
{id:'cmp-ble',name:'Régression BLE et notifications GATT',objective:'Comparer les solutions de diagnostic des notifications BLE.',status:'published',mode:'task_centred',owner:'Léa Martin',updated:'10 oct. 2026',tasks:['Diagnostic BLE'],tests:['TC-401'],solutions:['Claude + Claude Code'],runs:[{id:'RUN-021',tc:'TC-401',solution:'Claude + Claude Code',result:'Validé',date:'8 oct.',quality:92}],review:'Publié avec revue et traçabilité.',notes:'Mesures sur cible.'},

{id:'cmp-rtos',name:'Analyse des ISR STM32',objective:'Examiner les investigations sur interruptions et exécution détachée.',status:'in_progress',mode:'task_centred',owner:'Amine Lefèvre',updated:'12 oct. 2026',tasks:['Debug ISR'],tests:['TC-601'],solutions:['DeepSeek + OpenCode'],runs:[],review:'',notes:''}
];
const testDefs={
'TC-101':{title:'Implémenter le driver',task:'Driver KSZ8851SNL',objective:'Pilote fonctionnel',dod:'Compilation et tests intégration passants'},
'TC-102':{title:'Corriger un timeout SPI',task:'Driver KSZ8851SNL',objective:'Corriger une défaillance injectée',dod:'Reproduction et correction vérifiées'},
'TC-103':{title:'Robustesse aux interruptions',task:'Driver KSZ8851SNL',objective:'Tester les IRQ',dod:'Tests de non-régression passants'},
'TC-201':{title:'Diagnostiquer un défaut HIL',task:'Débogage HIL',objective:'Trouver cause racine',dod:'Hypothèse confirmée sur cible'},
'TC-301':{title:'Optimiser les étapes CI',task:'Optimisation CI',objective:'Réduire durée',dod:'Qualité et couverture inchangées'},
'TC-401':{title:'Déboguer une notification GATT',task:'Diagnostic BLE',objective:'Corriger BLE',dod:'Notifications répétables'},
'TC-501':{title:'Générer une page Sphinx',task:'Documentation technique',objective:'Rendre doc lisible',dod:'Build Sphinx réussi'},
'TC-601':{title:'Analyser ISR multi-périphériques',task:'Debug ISR',objective:'Trouver interaction de priorité',dod:'Preuve sur cible'}
};
const labels={planned:'Planifiée',in_progress:'En cours',under_review:'En revue',published:'Publiée'};
function load(){try{let v=JSON.parse(localStorage.getItem(KEY));return Array.isArray(v)?v:structuredClone(seed)}catch{return structuredClone(seed)}}
function save(list){localStorage.setItem(KEY,JSON.stringify(list))}
function el(id){return document.getElementById(id)}
function escapeHTML(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function badge(s){return `<span class="pill ${s==='published'?'green':s==='under_review'?'purple':s==='in_progress'?'orange':'gray'}">${labels[s]||s}</span>`}
function openModal(html){el('modal').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`}
function closeModal(){el('modal').innerHTML=''}
</script><script>
const id=new URLSearchParams(location.search).get('id')||'cmp-ethernet';let all=load(),c=all.find(x=>x.id===id),tab='overview';if(!c){document.querySelector('main').innerHTML='<a href="index.html">← Retour aux campagnes</a><div class="empty">Campagne introuvable.</div>';throw Error('Not found')}
function persist(){save(all);render()}
function stateActions(){let opts={planned:[['Démarrer','in_progress']],in_progress:[['Clore pour revue','under_review']],under_review:[['Reprendre les travaux','in_progress'],['Publier après revue','published']],published:[['Dépublier','under_review'],['Rouvrir','in_progress']]};return opts[c.status].map(([name,next])=>`<button class="btn ${next==='published'?'primary':''}" onclick="transition('${next}')">${name}</button>`).join('')}
function transition(next){if(next==='published'&&!c.runs.length){alert('Au moins un Run terminé doit exister avant une publication de résultats.');return}if(next==='published'&&!(c.review||'').trim()){alert('Saisir une décision de revue avant de publier.');show('review');return}c.status=next;persist()}
function show(name){tab=name;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));render()}
document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>show(x.dataset.tab));
function render(){el('head').innerHTML=`<div class="detailtop"><div><div class="eyebrow">${escapeHTML(c.id)}</div><h1>${escapeHTML(c.name)}</h1><p class="sub">${escapeHTML(c.objective)}</p><div style="margin-top:12px">${badge(c.status)} <span class="small muted"> · Responsable : ${escapeHTML(c.owner)} · Mise à jour : ${escapeHTML(c.updated)}</span></div></div><div class="tools"><button class="btn" onclick="editCampaign()">Modifier</button>${stateActions()}</div></div>`;el('body').innerHTML=tab==='overview'?overview():tab==='plan'?plan():tab==='runs'?runs():review();}
function overview(){return `<div class="info-grid"><section class="card panel"><div class="section-title"><h2>Description & périmètre</h2><button class="btn" onclick="editCampaign()">✎ Éditer</button></div><div class="pair"><label>Objectif</label><strong>${escapeHTML(c.objective)}</strong></div><div class="pair"><label>Notes</label><div>${escapeHTML(c.notes||'Aucune note')}</div></div><div class="pair"><label>Setup Guide</label><div>Guide référencé (exemple) · <a href="#" onclick="event.preventDefault();alert('Navigation vers Guides & Charter à intégrer')">Afficher</a></div></div><div class="pair"><label>Veille liée</label><div class="muted">Aucun signal dans cet exemple</div></div></section><aside class="stack"><section class="card panel"><h2>Contenu de la campagne</h2><div class="pair"><label>Tasks</label><strong>${c.tasks.length}</strong></div><div class="pair"><label>Test Cases</label><strong>${c.tests.length}</strong></div><div class="pair"><label>Configurations</label><strong>${c.solutions.length}</strong></div><div class="pair"><label>Runs enregistrés</label><strong>${c.runs.length}</strong></div><button class="btn" onclick="show('plan')">Ouvrir le plan d’évaluation →</button></section><section class="card panel"><h2>Traçabilité</h2><p class="small muted">Révisions, configurations épinglées, évènements et évidences historiques sont préservés par le backend réel.</p><button class="btn" onclick="alert('Historique détaillé : cible intégration Server')">Consulter l’historique</button></section></aside></div>`}
function plan(){let solutions=c.solutions;return `<div class="card panel"><div class="section-title"><div><h2>Plan d’évaluation</h2><p class="sub">Une Task → plusieurs Test Cases → plusieurs configurations. Chaque cellule représente une combinaison évaluable.</p></div><div class="tools"><button class="btn" onclick="addTest()">＋ Test Case</button><button class="btn" onclick="addSolution()">＋ Configuration</button></div></div><div class="notice small">Sélectionné par défaut lors de l’ajout d’une combinaison. Non sélectionné : aucune obligation. Dérogation : justification obligatoire. Une exécution terminée n'implique pas une DoD réussie.</div>${c.tests.length?`<div class="taskgroup"><div class="matrixwrap"><table class="matrix"><thead><tr><th>Task / Test Case</th>${solutions.map(x=>`<th>${escapeHTML(x)}</th>`).join('')}</tr></thead><tbody>${c.tests.map(tc=>{let t=testDefs[tc]||{title:tc,task:c.tasks[0]||'Task'};return `<tr><td><strong>${escapeHTML(t.title)}</strong><div class="small muted">${escapeHTML(tc)} · ${escapeHTML(t.task)}</div><button class="btn small danger" style="padding:5px 8px;margin-top:6px" onclick="removeTest('${tc}')">Retirer du plan</button></td>${solutions.map((s,i)=>{let key=tc+'|'+s,override=c.decisions?.[key];let found=c.runs.find(r=>r.tc===tc&&r.solution===s);let type=override?.type|| (found?'done':'selected');let text={done:'✓ Évalué',selected:'◷ Planifié',none:'— Non sélectionné',waived:'⊘ Dérogation',running:'◌ En cours'}[type];return `<td><button class="cell ${type}" onclick="openCell('${tc}',${i})">${text}</button>${found?`<div class="small muted" style="padding:5px">${escapeHTML(found.id)} · ${escapeHTML(found.result)}</div>`:''}${override?.reason?`<div class="small muted">${escapeHTML(override.reason).slice(0,70)}</div>`:''}</td>`}).join('')}</tr>`}).join('')}</tbody></table></div></div>`:'<div class="empty">Pas encore de Test Case dans ce plan. Ajoutez une Task et un Test Case.</div>'}<p class="small muted">La matrice constitue le plan de campagne. La gestion des résultats et des tentatives s’effectue dans « Runs ».</p></div>`}
function addTest(){let options=Object.entries(testDefs).filter(([id])=>!c.tests.includes(id));openModal(`<h2>Ajouter un Test Case</h2><p class="sub">La Task rattachée est reprise depuis Test Design.</p><form id="f" class="stack" style="margin-top:18px"><label>Test Case <select class="field" name="tc" required style="width:100%">${options.map(([id,d])=>`<option value="${id}">${escapeHTML(id)} — ${escapeHTML(d.title)} (${escapeHTML(d.task)})</option>`).join('')}</select></label><div class="dialog-actions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" ${options.length?'':'disabled'}>Ajouter</button></div></form>`);el('f').onsubmit=e=>{e.preventDefault();let tc=new FormData(e.target).get('tc');c.tests.push(tc);let task=testDefs[tc]?.task;if(task&&!c.tasks.includes(task))c.tasks.push(task);closeModal();persist()}}
function addSolution(){openModal(`<h2>Ajouter une configuration</h2><p class="sub">Référence illustrative : en production, sélectionner une configuration exacte, disponible et versionnée.</p><form id="f" class="stack" style="margin-top:20px"><input required class="field" name="solution" placeholder="Ex. Gemini + OpenCode"><div class="dialog-actions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">Ajouter</button></div></form>`);el('f').onsubmit=e=>{e.preventDefault();let s=new FormData(e.target).get('solution').trim();if(!c.solutions.includes(s))c.solutions.push(s);closeModal();persist()}}
function removeTest(tc){if(!confirm('Retirer ce Test Case du plan courant ? Les Runs historiques sont conservés.'))return;c.tests=c.tests.filter(x=>x!==tc);persist()}
function openCell(tc,i){let s=c.solutions[i],key=tc+'|'+s,decision=c.decisions?.[key],v=decision?.type|| (c.runs.some(r=>r.tc===tc&&r.solution===s)?'done':'selected');openModal(`<h2>Combinaison d’évaluation</h2><p>${escapeHTML(tc)} × <strong>${escapeHTML(s)}</strong></p><p class="small muted">Les états de sélection et d’exécution ne sont pas confondus.</p><form id="f" class="stack"><label>Décision<select class="field" name="type"><option value="selected" ${v==='selected'?'selected':''}>Sélectionné / planifié</option><option value="none" ${v==='none'?'selected':''}>Non sélectionné</option><option value="waived" ${v==='waived'?'selected':''}>Dérogation</option></select></label><label>Justification de dérogation<textarea class="field" name="reason" placeholder="Obligatoire pour une dérogation">${escapeHTML(decision?.reason||'')}</textarea></label><div class="dialog-actions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">Enregistrer</button></div></form><div style="margin-top:12px"><button class="btn" onclick="closeModal();show('runs')">Voir les Runs →</button></div>`);el('f').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),type=f.get('type'),reason=f.get('reason').trim();if(type==='waived'&&!reason){alert('Une justification est obligatoire.');return}c.decisions??={};c.decisions[key]={type,reason};closeModal();persist()}}
function runs(){return `<div class="card panel"><div class="section-title"><div><h2>Exécutions de benchmark</h2><p class="sub">Tentatives individuelles et leurs évidences. Plusieurs Runs peuvent évaluer la même combinaison.</p></div><button class="btn primary" onclick="newRun()">＋ Nouveau Run</button></div>${c.runs.length?`<div class="run small muted" style="font-weight:700;background:#fafbfd"><div>Run / Test Case</div><div>Configuration</div><div>Résultat DoD</div><div>Qualité</div><div></div></div>${c.runs.map(r=>`<div class="run"><div><strong>${escapeHTML(r.id)}</strong><div class="small muted">${escapeHTML(r.tc)} · ${escapeHTML(r.date)}</div></div><div>${escapeHTML(r.solution)}</div><div><span class="pill ${r.result==='Validé'?'green':'red'}">${escapeHTML(r.result)}</span></div><div>${r.quality}/100</div><button class="btn" onclick="runDetail('${r.id}')">Ouvrir</button></div>`).join('')}`:'<div class="empty">Aucun Run pour cette campagne. Lancez une nouvelle exécution.</div>'}<div class="notice small" style="margin-top:15px">Prototype : le Run est simulé par des valeurs abrégées. Le vrai flux garde préparation, Setup Guide, interactions chronométrées, coûts, sorties, pièces jointes, DoD et revues, avec traces immuables.</div></div>`}
function newRun(){if(!c.tests.length||!c.solutions.length){alert('Ajouter au moins un Test Case et une configuration au plan.');show('plan');return}openModal(`<h2>Nouvelle exécution</h2><p class="sub">Écran d’entrée simplifié ; la séquence détaillée de Run est un parcours dédié.</p><form id="f" class="formgrid"><label>Test Case<select class="field" name="tc">${c.tests.map(x=>`<option>${escapeHTML(x)}</option>`).join('')}</select></label><label>Configuration<select class="field" name="sol">${c.solutions.map(x=>`<option>${escapeHTML(x)}</option>`).join('')}</select></label><label>DoD<select class="field" name="result"><option>Validé</option><option>Échec DoD</option></select></label><label>Qualité / 100<input class="field" name="quality" type="number" min="0" max="100" value="75"></label><div class="full dialog-actions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">Enregistrer l’exécution fictive</button></div></form>`);el('f').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);c.runs.push({id:'RUN-'+String(Date.now()).slice(-5),tc:f.get('tc'),solution:f.get('sol'),result:f.get('result'),quality:Number(f.get('quality')),date:'14 oct.'});closeModal();persist()}}
function runDetail(runid){let r=c.runs.find(x=>x.id===runid);openModal(`<h2>${escapeHTML(r.id)} · Exécution</h2><p class="sub">${escapeHTML(r.tc)} · ${escapeHTML(r.solution)}</p><div class="pair"><label>Definition of Done</label><strong>${escapeHTML(r.result)}</strong></div><div class="pair"><label>Qualité</label><strong>${r.quality}/100</strong></div><div class="pair"><label>Durées & interactions</label><div class="muted">Voir le parcours Run complet lors de l'intégration</div></div><div class="pair"><label>Artefacts originaux</label><div class="muted">Accès autorisé depuis l'historique de l'exécution</div></div><div class="dialog-actions"><button class="btn" onclick="closeModal()">Fermer</button></div>`)}
function reviewThreads(){
 c.reviewThreads??=[];
 return c.reviewThreads;
}
function review(){let threads=reviewThreads();return `<div class="info-grid"><section class="card panel"><div class="section-title"><div><h2>Commentaires de revue</h2><p class="sub">Chaque commentaire lance un fil. Plusieurs contributeurs peuvent répondre, et chaque fil peut être ouvert ou clos.</p></div><button class="btn primary" onclick="newReviewThread()">＋ Nouveau commentaire</button></div><div class="stack">${threads.length?threads.map(t=>`<article class="review-thread"><div class="section-title" style="margin-bottom:9px"><div><strong>${escapeHTML(t.subject)}</strong><div class="small muted">${escapeHTML(t.author)} · ${escapeHTML(t.date)}</div></div><span class="pill ${t.state==='closed'?'green':'orange'}">${t.state==='closed'?'Clos':'Ouvert'}</span></div><p style="white-space:pre-wrap;margin:8px 0 15px">${escapeHTML(t.message)}</p>${t.replies.map(m=>`<div class="review-reply"><div class="small muted"><strong>${escapeHTML(m.author)}</strong> · ${escapeHTML(m.date)}</div><div style="white-space:pre-wrap;margin-top:6px">${escapeHTML(m.message)}</div></div>`).join('')}<div class="tools" style="margin-top:14px"><button class="btn" onclick="replyToThread('${t.id}')">Répondre</button><button class="btn" onclick="toggleThread('${t.id}')">${t.state==='closed'?'Rouvrir':'Marquer comme clos'}</button></div></article>`).join(''):'<div class="empty" style="padding:38px">Aucun commentaire de revue. Créez un fil pour demander une correction, clarifier une décision ou documenter une observation.</div>'}</div><div style="margin-top:24px;border-top:1px solid #e2e8f1;padding-top:20px"><h3>Conclusion de revue et publication</h3><p class="small muted">Les fils restent indépendants de la décision finale de publication.</p><textarea id="reviewText" class="field" aria-label="Conclusion de revue" placeholder="Motivation de la décision...">${escapeHTML(c.review||'')}</textarea><div style="margin-top:11px"><button class="btn" onclick="c.review=el('reviewText').value;persist()">Enregistrer la conclusion</button></div></div><div class="notice small" style="margin-top:18px">Prototype : auteurs simulés. En production, chaque commentaire et réponse utilise l’identité authentifiée et un historique immuable.</div></section><aside class="card panel"><h2>Pipeline de campagne</h2><div class="stack" style="margin-top:16px">${Object.entries(labels).map(([k,l])=>`<div class="inputrow"><i class="pip ${k}"></i><strong>${l}</strong>${k===c.status?badge(k):''}</div>`).join('')}</div><hr style="border:0;border-top:1px solid #edf0f5;margin:22px 0"><h3>Actions de cycle de vie</h3><div class="tools">${stateActions()}</div><p class="small muted">Clore un fil de discussion n'implique ni approbation ni publication de la campagne.</p></aside></div>`}
function newReviewThread(){openModal(`<h2>Nouveau commentaire de revue</h2><form id="f" class="stack" style="margin-top:18px"><label>Auteur (simulation)<select name="author" class="field"><option>Camille Bernard</option><option>Amine Lefèvre</option><option>Léa Martin</option></select></label><label>Sujet<input name="subject" class="field" required placeholder="Ex. Justifier l’évaluation du TC-102"></label><label>Commentaire<textarea name="message" class="field" required></textarea></label><div class="dialog-actions"><button class="btn" type="button" onclick="closeModal()">Annuler</button><button class="btn primary">Créer le fil</button></div></form>`);el('f').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);reviewThreads().unshift({id:'thr-'+Date.now(),subject:f.get('subject').trim(),message:f.get('message').trim(),author:f.get('author'),date:new Date().toLocaleDateString('fr-FR'),state:'open',replies:[]});closeModal();persist()}}
function replyToThread(id){let t=reviewThreads().find(x=>x.id===id);if(!t)return;openModal(`<h2>Répondre au fil</h2><p class="sub">${escapeHTML(t.subject)}</p><form id="f" class="stack" style="margin-top:18px"><label>Auteur (simulation)<select name="author" class="field"><option>Amine Lefèvre</option><option>Léa Martin</option><option>Camille Bernard</option></select></label><label>Réponse<textarea name="message" class="field" required></textarea></label><div class="dialog-actions"><button class="btn" type="button" onclick="closeModal()">Annuler</button><button class="btn primary">Publier la réponse</button></div></form>`);el('f').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);t.replies.push({author:f.get('author'),message:f.get('message').trim(),date:new Date().toLocaleDateString('fr-FR')});closeModal();persist()}}
function toggleThread(id){let t=reviewThreads().find(x=>x.id===id);if(t){t.state=t.state==='closed'?'open':'closed';persist()}}
function editCampaign(){openModal(`<h2>Modifier la campagne</h2><form id="f" class="formgrid" style="margin-top:20px"><label class="full">Titre<input class="field" name="name" value="${escapeHTML(c.name)}" required></label><label class="full">Objectif<textarea class="field" name="objective" required>${escapeHTML(c.objective)}</textarea></label><label>Responsable<input class="field" name="owner" value="${escapeHTML(c.owner)}"></label><label class="full">Notes<textarea class="field" name="notes">${escapeHTML(c.notes)}</textarea></label><div class="full dialog-actions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">Enregistrer</button></div></form>`);el('f').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);['name','objective','owner','notes'].forEach(k=>c[k]=f.get(k));closeModal();persist()}}
render();
</script></body></html>
