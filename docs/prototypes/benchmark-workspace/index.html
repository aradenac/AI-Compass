gn-items:center;justify-content:center;padding:20px;z-index:10}.modal{background:white;border-radius:16px;padding:23px;width:min(610px,95vw);max-height:90vh;overflow:auto;box-shadow:0 15px 60px #0a142c44}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid label{display:flex;flex-direction:column;gap:6px;color:#65758c;font-size:12px;font-weight:650}.formgrid label.full{grid-column:1/-1}.formgrid input,.formgrid select,.formgrid textarea{width:100%}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:19px}.empty{text-align:center;padding:70px 20px;color:#7a889b}.stack{display:grid;gap:14px}.checkrow{display:flex;gap:9px;align-items:center;padding:7px 0}.compact{padding:12px 16px}.right{text-align:right}@media(max-width:1060px){.shell{padding:20px}.board{grid-template-columns:repeat(2,minmax(260px,1fr))}.info-grid{grid-template-columns:1fr}}@media(max-width:650px){.board{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}.run{grid-template-columns:1fr 1fr}.filters .count{width:100%}.formgrid{grid-template-columns:1fr}}

/* Unified Workgroup editorial system */
:root{font-family:Inter,'Segoe UI',system-ui,sans-serif;background:#f6f8fb;color:#162c40;font-size:13.5px;--teal:#128a88;--line:#e2eaf0;--ink:#142d40}body{background:linear-gradient(180deg,#f9fbfd 0,#f3f6fa 100%);min-height:100vh}.shell{max-width:1536px;padding:34px 42px 55px}.eyebrow{color:#15908a;font-size:10px;letter-spacing:.13em}.top{margin-bottom:26px}.top h1,.detailtop h1{font-size:31px;font-weight:750;letter-spacing:-1.15px;color:#132a3d;margin:7px 0 9px}.sub{font-size:13px;line-height:1.5;color:#73849a}.card{border:1px solid #e2eaf0;border-radius:14px;box-shadow:0 5px 20px #13334a06}.btn{border:1px solid #d7e3e9;color:#285064;border-radius:9px;box-shadow:0 1px 2px #12344a06;transition:all .15s}.btn.primary,.primary{background:#138e89;border-color:#138e89;color:white}.btn.primary:hover{background:#0b736f}.filters{background:white;border-radius:13px;gap:10px;padding:14px;margin-bottom:22px;box-shadow:0 6px 18px #163b4a05}.field{border:1px solid #dbe5ec;border-radius:8px;min-height:39px}.field:focus{box-shadow:0 0 0 3px #15a19820}.seg{background:#eef4f6}.seg button.active{color:#117c7b}.board{gap:17px;grid-template-columns:repeat(4,minmax(0,1fr));align-items:stretch}.lane{background:#f1f5f9;border:1px solid #e8eef4;min-height:600px;padding:13px;border-radius:13px}.lane:nth-child(1){background:#f2f5f8}.lane:nth-child(2){background:#eef7f7}.lane:nth-child(3){background:#f5f1fa}.lane:nth-child(4){background:#eef8f5}.lane-header{padding:9px 7px 17px;font-size:14px;color:#263f52}.lane-header .num{font-weight:650;border:1px solid #e5edf2}.item{padding:18px 17px;margin-bottom:12px;border:1px solid #e2e9ee;box-shadow:0 4px 15px #193b4808;transition:transform .15s,border-color .15s}.item:hover{transform:translateY(-2px);border-color:#7dc8c0;box-shadow:0 8px 23px #204d5914}.item strong{font-size:15px;letter-spacing:-.25px;color:#18354c;margin:13px 0 8px}.item .sub,.item .muted{line-height:1.5}.item-meta{border-top:1px solid #edf2f5;padding-top:12px;margin-top:15px;font-size:11px}.bar{height:4px;background:#edf1f3}.bar i{background:#29a69d}.pill{border-radius:7px;padding:5px 9px;font-size:10.5px}.pill.gray{background:#edf2f6}.pill.green{background:#e3f4ed}.pill.orange{background:#fff3df}.pill.purple{background:#efe8f9}.tabs{gap:9px;margin:26px 0 22px}.tab{font-weight:660;padding:13px 16px}.tab.active{color:#087c78;border-bottom-color:#148e89}.panel{padding:25px 28px}.panel h2{font-size:18px;letter-spacing:-.4px}.info-grid{grid-template-columns:minmax(0,1.7fr) minmax(290px,.82fr);gap:20px}.pair{grid-template-columns:133px minmax(0,1fr);margin:19px 0;gap:17px}.pair label{font-weight:600;color:#8390a2}.matrixwrap{border:1px solid #e7edf0;border-radius:10px;overflow:auto}.matrix th{background:#f3f7f9;text-transform:none;font-size:12px}.matrix td,.matrix th{padding:15px}.matrix td:first-child{box-shadow:3px 0 8px #162d3b07}.cell{border-radius:7px}.taskgroup summary{background:#f2f8f9}.tcrow{background:white}.run{grid-template-columns:1.4fr 1.1fr .9fr .45fr auto}.detailtop{background:white;border:1px solid #e3ebef;border-radius:15px;padding:25px 28px;box-shadow:0 5px 20px #16354a06}.notice{background:#f0f9f7;border-color:#d6ece8}.modal{border:1px solid #e5edf2;box-shadow:0 25px 70px #122e3c44}.listTable th{background:#f3f7f9}.listTable td{vertical-align:middle}@media(max-width:1080px){.shell{padding:24px}.board{grid-template-columns:repeat(2,minmax(0,1fr))}.lane{min-height:250px}.info-grid{grid-template-columns:minmax(0,1fr)}.top h1{font-size:28px}}@media(min-width:1081px) and (max-width:1280px){.shell{padding:25px}.board{gap:9px}.lane{padding:9px}.item{padding:13px}.filters{gap:7px}}.count{font-weight:650}.section-title{margin-bottom:20px}
</style></head><body><main class="shell"><div class="top"><div><div class="eyebrow">AI Compass / Workgroup Studio</div><h1>Benchmark Workspace</h1><p class="sub">Campagnes · pipeline de suivi et gestion des évaluations</p></div><button class="btn primary" onclick="createCampaign()">＋ Nouvelle campagne</button></div><div class="card filters"><input class="field search" id="search" placeholder="Rechercher une campagne, une Task, un objectif…" aria-label="Rechercher"><select class="field" id="mode"><option value="">Tous les modes</option><option value="task_centred">Centrée Task</option><option value="solution_centred">Centrée solution</option></select><select class="field" id="owner"><option value="">Tous les responsables</option></select><select class="field" id="status"><option value="">Tous les états</option><option value="planned">Planifiée</option><option value="in_progress">En cours</option><option value="under_review">En revue</option><option value="published">Publiée</option></select><div class="seg"><button id="boardButton" class="active" onclick="setView('board')">Pipeline</button><button id="listButton" onclick="setView('list')">Liste</button></div><span id="counter" class="count"></span></div><div id="content"></div></main><div id="modal"></div><script>const KEY='aic-benchmark-design-v1';
const seed=[
{id:'cmp-ethernet',name:'Driver Ethernet KSZ8851SNL',objective:'Comparer les configurations IA sur l’implémentation, le diagnostic et la robustesse du driver Ethernet.',status:'in_progress',mode:'task_centred',owner:'Camille Bernard',updated:'14 oct. 2026',tasks:['Driver KSZ8851SNL'],tests:['TC-101','TC-102','TC-103'],solutions:['Claude + Claude Code','DeepSeek + OpenCode'],runs:[{id:'RUN-041',tc:'TC-101',solution:'Claude + Claude Code',result:'Validé',date:'12 oct.',quality:87},{id:'RUN-042',tc:'TC-102',solution:'DeepSeek + OpenCode',result:'Échec DoD',date:'13 oct.',quality:48}],review:'',notes:'Tester sur un dépôt Zephyr et vérifier les régressions.'},
{id:'cmp-hil',name:'Diagnostic HIL nRF54L15',objective:'Valider la capacité des agents à investiguer des défauts matériels.',status:'under_review',mode:'task_centred',owner:'Amine Lefèvre',updated:'13 oct. 2026',tasks:['Débogage HIL'],tests:['TC-201'],solutions:['Claude + Claude Code'],runs:[{id:'RUN-039',tc:'TC-201',solution:'Claude + Claude Code',result:'Validé',date:'13 oct.',quality:81}],review:'Évidences à confirmer.',notes:'Banc HIL, traces et sonde.'},
{id:'cmp-ci',name:'Optimisation de CI embarquée',objective:'Évaluer la réduction de durée CI à qualité constante.',status:'planned',mode:'solution_centred',owner:'Camille Bernard',updated:'11 oct. 2026',tasks:['Optimisation CI'],tests:['TC-301'],solutions:['DeepSeek + OpenCode'],runs:[],review:'',notes:'Contrôler la couverture tests.'},
{id:'cmp-ble',name:'Régression BLE et notifications GATT',objective:'Comparer les solutions de diagnostic des notifications BLE.',status:'published',mode:'task_centred',owner:'Léa Martin',updated:'10 oct. 2026',tasks:['Diagnostic BLE'],tests:['TC-401'],solutions:['Claude + Claude Code'],runs:[{id:'RUN-021',tc:'TC-401',solution:'Claude + Claude Code',result:'Validé',date:'8 oct.',quality:92}],review:'Publié avec revue et traçabilité.',notes:'Mesures sur cible.'},
{id:'cmp-doc',name:'Documentation Sphinx embarquée',objective:'Qualité de génération et mise à jour de documentation.',status:'planned',mode:'solution_centred',owner:'Léa Martin',updated:'9 oct. 2026',tasks:['Documentation technique'],tests:['TC-501'],solutions:['Claude + Claude Code'],runs:[],review:'',notes:''},
{id:'cmp-rtos',name:'Analyse des ISR STM32',objective:'Examiner les investigations sur interruptions et exécution détachée.',status:'in_progress',mode:'task_centred',owner:'Amine Lefèvre',updated:'12 oct. 2026',tasks:['Debug ISR'],tests:['TC-601'],solutions:['DeepSeek + OpenCode'],runs:[],review:'',notes:''}
];
const testDefs={
'TC-101':{title:'Implémenter le driver',task:'Driver KSZ8851SNL',objective:'Pilote fonctionnel',dod:'Compilation et tests intégration passants'},
'TC-102':{title:'Corriger un timeout SPI',task:'Driver KSZ8851SNL',objective:'Corriger une défaillance injectée',dod:'Reproduction et correction vérifiées'},
'TC-103':{title:'Robustesse aux interruptions',task:'Driver KSZ8851SNL',objective:'Tester les IRQ',dod:'Tests de non-régression passants'},
'TC-201':{title:'Diagnostiquer un défaut HIL',task:'Débogage HIL',objective:'Trouver cause racine',dod:'Hypothèse confirmée sur cible'},
'TC-301':{title:'Optimiser les étapes CI',task:'Optimisation CI',objective:'Réduire durée',dod:'Qualité et couverture inchangées'},
'TC-401':{title:'Déboguer une notification GATT',task:'Diagnostic BLE',objective:'Corriger BLE',dod:'Notifications répétables'},
'TC-501':{title:'Générer une page Sphinx',task:'Documentation technique',objective:'Rendre doc lisible',dod:'Build Sphinx réussi'},
'TC-601':{title:'Analyser ISR multi-périphériques',task:'Debug ISR',objective:'Trouver interaction de priorité',dod:'Preuve sur cible'}
};
const labels={planned:'Planifiée',in_progress:'En cours',under_review:'En revue',published:'Publiée'};
function load(){try{let v=JSON.parse(localStorage.getItem(KEY));return Array.isArray(v)?v:structuredClone(seed)}catch{return structuredClone(seed)}}
function save(list){localStorage.setItem(KEY,JSON.stringify(list))}
function el(id){return document.getElementById(id)}
function escapeHTML(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function badge(s){return `<span class="pill ${s==='published'?'green':s==='under_review'?'purple':s==='in_progress'?'orange':'gray'}">${labels[s]||s}</span>`}
function openModal(html){el('modal').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`}
function closeModal(){el('modal').innerHTML=''}
</script><script>
let campaigns=load(),view='board';
function setView(v){view=v;el('boardButton').classList.toggle('active',v==='board');el('listButton').classList.toggle('active',v==='list');render()}
function filtered(){let q=el('search').value.toLocaleLowerCase('fr');return campaigns.filter(c=>(!q||[c.name,c.objective,c.owner,...c.tasks].join(' ').toLocaleLowerCase('fr').includes(q))&&(!el('mode').value||c.mode===el('mode').value)&&(!el('owner').value||c.owner===el('owner').value)&&(!el('status').value||c.status===el('status').value))}
function card(c){let total=Math.max(1,c.tests.length*c.solutions.length),percent=Math.min(100,Math.round(c.runs.length/total*100));return `<a class="item" href="campaign.html?id=${encodeURIComponent(c.id)}"><span class="pill gray">${c.mode==='task_centred'?'Task-centric':'Solution-centric'}</span><strong>${escapeHTML(c.name)}</strong><div class="small muted">${escapeHTML(c.objective).slice(0,103)}</div><div class="item-meta"><span>${escapeHTML(c.owner)}</span><span>${escapeHTML(c.updated)}</span></div><div class="bar" title="Runs enregistrés, indicateur illustratif (pas couverture validée)"><i style="width:${percent}%"></i></div><div class="small muted" style="margin-top:8px">${c.tests.length} Test Cases · ${c.runs.length} Runs</div></a>`}
function render(){let items=filtered();el('counter').textContent=items.length+' campagnes';if(view==='board'){el('content').innerHTML=`<div class="board">${Object.entries(labels).map(([key,label])=>{let group=items.filter(x=>x.status===key);return `<section class="lane"><div class="lane-header"><i class="pip ${key}"></i>${label}<span class="num">${group.length}</span></div>${group.length?group.map(card).join(''):'<p class="small muted" style="padding:12px">Aucune campagne</p>'}</section>`}).join('')}</div>`}else{el('content').innerHTML=`<div class="card" style="overflow:auto"><table class="listTable"><thead><tr><th>Campagne</th><th>Pipeline</th><th>Mode</th><th>Responsable</th><th>Test Cases</th><th>Runs</th></tr></thead><tbody>${items.map(c=>`<tr onclick="location.href='campaign.html?id=${encodeURIComponent(c.id)}'"><td><strong>${escapeHTML(c.name)}</strong><div class="small muted">${escapeHTML(c.id)}</div></td><td>${badge(c.status)}</td><td>${c.mode==='task_centred'?'Task-centric':'Solution-centric'}</td><td>${escapeHTML(c.owner)}</td><td>${c.tests.length}</td><td>${c.runs.length}</td></tr>`).join('')}</tbody></table>${!items.length?'<div class="empty">Aucune campagne pour ces filtres.</div>':''}</div>`}}
function createCampaign(){openModal(`<h2>Nouvelle campagne</h2><p class="sub">Définir le périmètre initial. La gestion des Test Cases, configurations et Runs se fait dans la fiche complète.</p><form id="newForm" class="formgrid" style="margin-top:20px"><label class="full">Nom<input class="field" required name="name" placeholder="Ex. Benchmark de drivers Zephyr"></label><label>Mode<select class="field" name="mode"><option value="task_centred">Centrée Task</option><option value="solution_centred">Centrée solution</option></select></label><label>Responsable<input class="field" name="owner" value="Camille Bernard"></label><label class="full">Objectif<textarea class="field" name="objective" required placeholder="Objectif d'évaluation"></textarea></label><div class="full dialog-actions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">Créer et ouvrir la campagne</button></div></form>`);el('newForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),id='cmp-demo-'+Date.now();campaigns.unshift({id,name:f.get('name'),objective:f.get('objective'),mode:f.get('mode'),owner:f.get('owner'),status:'planned',updated:'14 oct. 2026',tasks:[],tests:[],solutions:[],runs:[],review:'',notes:''});save(campaigns);location.href='campaign.html?id='+id}}
[el('search'),el('mode'),el('owner'),el('status')].forEach(x=>x.addEventListener(x.id==='search'?'input':'change',render));el('owner').innerHTML+=[...new Set(campaigns.map(x=>x.owner))].map(x=>`<option>${escapeHTML(x)}</option>`).join('');render();
</script></body></html>
