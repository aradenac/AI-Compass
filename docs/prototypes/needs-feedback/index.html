<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Needs & Feedback — Workgroup prototype</title>
<style>
:root{--bg:#f4f7fb;--surface:#fff;--line:#dce4ee;--ink:#172940;--muted:#67788e;--accent:#087f91;--soft:#e9f8fa;--shadow:0 5px 24px #2239540b}*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #36a9e0;outline-offset:2px}.app{padding:20px;max-width:1740px;margin:auto}.top{display:flex;align-items:center;gap:18px;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap}.heading h1{margin:0;font-size:25px;letter-spacing:-.7px}.heading p{margin:2px 0;color:var(--muted)}.primary{border:0;background:#088a9b;color:white;border-radius:9px;padding:11px 17px;font-weight:700}.primary:hover{background:#056d7b}.stats{display:flex;gap:9px;flex-wrap:wrap}.stat{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 15px;min-width:115px}.stat strong{display:block;font-size:21px}.stat small{color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(280px,31%) minmax(420px,1fr) minmax(250px,24%);gap:12px;align-items:start}.panel{background:white;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-height:640px;overflow:hidden}.pane-head{padding:16px 18px;border-bottom:1px solid var(--line)}.pane-head h2{font-size:17px;margin:0}.muted{color:var(--muted)}.tabbar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}.tab{border:0;border-radius:7px;background:transparent;padding:8px 10px;color:#52647c}.tab[aria-pressed=true]{background:var(--soft);color:#075f71;font-weight:700}.tools{padding:12px 15px;border-bottom:1px solid var(--line)}.search,.field{width:100%;border:1px solid #cdd9e6;border-radius:8px;padding:10px 11px;background:white;color:var(--ink)}.inline{display:flex;gap:7px;margin-top:8px}.inline select{min-width:0;flex:1}.listing{max-height:calc(100vh - 286px);min-height:430px;overflow:auto;padding:8px}.item{display:block;width:100%;text-align:left;background:white;border:1px solid transparent;border-radius:10px;padding:12px;margin-bottom:5px}.item:hover{background:#f6fafc}.item.active{background:#eaf8fa;border-color:#1da7b5}.item .line{display:flex;justify-content:space-between;gap:8px;align-items:start}.item strong{font-size:13px}.item p{color:#64788e;margin:5px 0;font-size:12px}.item small{color:#788a9b}.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;background:#eef2f7;color:#49617a}.idea{background:#eeeafa;color:#6c4ac5}.support{background:#fff0e2;color:#ae5d13}.feedback{background:#dcf5e9;color:#137b4e}.question{background:#e7f0ff;color:#285eb4}.request{background:#e8f3ff;color:#2766ab}.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}.detail-head h2{font-size:20px;line-height:1.2;margin:6px 0}.detail-body{padding:20px 23px}.detail-body h3{font-size:14px;margin:23px 0 8px}.detail-body p{line-height:1.7}.author{border:0;background:none;color:#087e91;padding:0;text-decoration:underline;text-underline-offset:3px}.attachment{border:1px solid var(--line);border-radius:9px;padding:11px;display:flex;gap:9px;align-items:center;margin:8px 0;background:#fbfdff}.attachment span:last-child{margin-left:auto;color:var(--muted);font-size:12px}.conversation{border-top:1px solid var(--line);padding-top:14px}.message{border:1px solid var(--line);border-radius:11px;padding:12px;margin:10px 0}.message.internal{background:#fff8e8;border-color:#edcf9d}.message-header{display:flex;align-items:center;gap:8px;justify-content:space-between}.message-header .person{font-weight:700}.message p{margin:9px 0}.composer{background:#f6f9fc;padding:13px;border-radius:10px;margin-top:14px}.composer textarea{width:100%;min-height:75px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:9px}.composer-footer{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:9px}.secondary{border:1px solid var(--line);background:white;border-radius:8px;padding:8px 11px;color:#30566c}.meta{padding:17px}.meta label{display:block;font-size:12px;color:#64778d;margin:0 0 6px;font-weight:600}.group{margin-bottom:19px}.helper{font-size:11px;color:var(--muted);margin-top:5px}.profile{border:0;background:#f2f8fb;border-radius:9px;text-align:left;padding:11px;width:100%;color:var(--ink)}.profile strong{display:block;color:#087e91}.side-note{padding:12px;background:#f5f8fc;border-radius:10px;font-size:12px;color:#566c80}.related{display:block;width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;margin:6px 0;padding:10px;text-align:left}.modal-back{position:fixed;inset:0;background:#0a182b99;display:grid;place-items:center;padding:20px;z-index:10}.modal{width:min(590px,100%);max-height:90vh;overflow:auto;background:white;border-radius:15px;padding:23px;box-shadow:0 24px 80px #07132666}.modal h2{margin-top:0}.modal label{display:block;margin-top:14px;margin-bottom:5px;font-weight:600}.modal textarea{min-height:110px}.modal footer{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.empty{padding:20px;color:var(--muted)}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:1120px){.layout{grid-template-columns:280px minmax(390px,1fr)}.meta-panel{grid-column:2;min-height:0}.listing{max-height:650px}}@media(max-width:780px){.layout{display:block}.panel{min-height:0;margin:10px 0}.listing{max-height:340px}.stats{width:100%}}
</style></head><body><div class="app"><header class="top"><div class="heading"><h1>Needs & Feedback</h1><p>Écouter les utilisateurs, échanger et relier leurs besoins aux études IA</p></div><button class="primary" id="new">＋ Nouveau besoin / feedback</button><div class="stats" id="stats" aria-label="Répartition des discussions"></div></header><main class="layout"><section class="panel"><div class="pane-head"><h2>Explorer les contributions</h2></div><div class="tools"><div class="tabbar" id="tabs"></div><input class="search" id="search" aria-label="Rechercher une contribution" placeholder="Rechercher dans les titres et contenus…"><div class="inline"><select id="typeFilter" aria-label="Filtrer par type"><option value="">Tous les types</option></select><select id="statusFilter" aria-label="Filtrer par statut"><option value="">Tous les statuts</option><option>Nouveau</option><option>En cours</option><option>Fermé</option></select></div><div class="inline"><select id="priorityFilter" aria-label="Filtrer par priorité"><option value="">Toutes les priorités</option><option>Haute</option><option>Normale</option><option>Basse</option></select><select id="sort" aria-label="Tri"><option value="recent">Plus récents</option><option value="old">Plus anciens</option><option value="title">Par titre</option></select></div></div><div class="listing" id="list" role="listbox" aria-label="Contributions"></div></section><section class="panel"><div class="pane-head" id="detailHeader"></div><article class="detail-body" id="detail"></article></section><aside class="panel meta-panel"><div class="pane-head"><h2>Métadonnées & liens</h2><small class="muted">Modifiables par le Workgroup</small></div><div class="meta" id="meta"></div></aside></main></div><div id="modalHost"></div>
<script>
// Prototype: data, comments, counts and permissions are mocked. All edits are local to this page session.
const kinds=['Idée','Support','Retour d’expérience','Question','Demande','Discussion'];
const entries=[
{id:'thr-001',title:'Automatiser les comptes rendus techniques',type:'Idée',status:'Nouveau',priority:'Haute',created:'2026-10-12T09:24:00',author:'Julien Dubois',profile:'usr-014',summary:'Proposition de génération de synthèses de réunions et de décisions.',body:'Lors des revues techniques, nous consacrons beaucoup de temps à la rédaction de comptes rendus. Nous aimerions explorer une solution IA permettant de structurer les notes, décisions et actions sans perdre leur traçabilité.',context:'Réunions de revue de conception et suivi R&D.',links:[{label:'Task · Synthèse de documentation',id:'tsk-001'}],attachments:[{name:'exemple-compte-rendu.pdf',size:'240 Ko'}],messages:[{name:'Julien Dubois',internal:false,date:'12 oct.',text:'Un traitement en français et une validation humaine seraient nécessaires.'},{name:'Membre Workgroup',internal:true,date:'13 oct.',text:'Examiner les solutions mesurées pour cette Task avant toute nouvelle campagne.'}]},
{id:'thr-002',title:'Erreur lors de la génération d’un guide',type:'Support',status:'En cours',priority:'Haute',created:'2026-10-11T15:10:00',author:'Alice Chen',profile:'usr-021',summary:'Échec reproductible de génération avec une configuration existante.',body:'Le guide de démarrage affiche une étape absente et refuse la validation de la configuration utilisée. Je joins la sortie et les conditions exactes de reproduction.',context:'Configuration de modèle et harness.',links:[{label:'Harness · OpenCode',id:'har-031'}],attachments:[{name:'trace.txt',size:'12 Ko'}],messages:[{name:'Alice Chen',internal:false,date:'11 oct.',text:'Le problème est reproductible sur mon poste Linux.'}]},
{id:'thr-003',title:'Retour positif sur la synthèse documentaire',type:'Retour d’expérience',status:'Fermé',priority:'Normale',created:'2026-10-10T12:05:00',author:'Marc Leclerc',profile:'usr-017',summary:'Usage quotidien d’une solution publiée pour résumer des documents.',body:'La synthèse fonctionne bien sur des spécifications courtes, avec quelques limites sur les tableaux et annexes volumineuses.',context:'Analyse documentaire.',links:[{label:'AI Solution · Configuration mesurée',id:'sol-024'}],attachments:[],messages:[{name:'Marc Leclerc',internal:false,date:'10 oct.',text:'Gain de temps sensible pour préparer les revues.'}]},
{id:'thr-004',title:'Compatibilité Windows de l’outil retenu',type:'Question',status:'Nouveau',priority:'Normale',created:'2026-10-09T10:00:00',author:'Samira Petit',profile:'usr-032',summary:'Question concernant les prérequis d’installation sur Windows.',body:'Existe-t-il une variante sans WSL pour la configuration recommandée ?',context:'Environnement utilisateur.',links:[],attachments:[],messages:[]},
{id:'thr-005',title:'Accès à une configuration de développement',type:'Demande',status:'En cours',priority:'Basse',created:'2026-10-08T16:00:00',author:'Thomas Moreau',profile:'usr-018',summary:'Souhait d’utiliser une solution référencée dans le catalogue.',body:'Je souhaiterais tester l’outil dans mon contexte embarqué.',context:'Développement embarqué.',links:[],attachments:[],messages:[]},
{id:'thr-006',title:'Clarifier les critères des évaluations HIL',type:'Discussion',status:'Nouveau',priority:'Normale',created:'2026-10-07T11:50:00',author:'Nadia Bernard',profile:'usr-045',summary:'Proposition ouverte sur la reproductibilité des mesures HIL.',body:'Comment présenter les limitations matérielles et la part de jugement humain dans les résultats ?',context:'Tests et validation.',links:[{label:'Task · Qualification HIL',id:'tsk-078'}],attachments:[],messages:[]}
];
let selected=entries[0].id,tab='Tous';const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const dt=s=>new Date(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});function cls(t){return({'Idée':'idea','Support':'support','Retour d’expérience':'feedback','Question':'question','Demande':'request','Discussion':'question'})[t]||''}function stats(){let by=s=>entries.filter(x=>x.status===s).length;$('stats').innerHTML=`<div class="stat"><strong>${entries.length}</strong><small>Total</small></div><div class="stat"><strong>${by('Nouveau')}</strong><small>Nouveau</small></div><div class="stat"><strong>${by('En cours')}</strong><small>En cours</small></div><div class="stat"><strong>${by('Fermé')}</strong><small>Fermé</small></div>`}function tabs(){let vals=['Tous','Besoins & idées','Support','Retours'];$('tabs').innerHTML=vals.map(t=>`<button class="tab" aria-pressed="${t===tab}" data-tab="${esc(t)}">${t}</button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}function list(){let a=entries.filter(x=>(!$('search').value||[x.title,x.body,x.summary,x.author].join(' ').toLowerCase().includes($('search').value.toLowerCase()))&&(!$('typeFilter').value||x.type===$('typeFilter').value)&&(!$('statusFilter').value||x.status===$('statusFilter').value)&&(!$('priorityFilter').value||x.priority===$('priorityFilter').value)&&(tab==='Tous'||(tab==='Besoins & idées'?['Idée','Demande'].includes(x.type):tab==='Support'?['Support','Question'].includes(x.type):['Retour d’expérience','Discussion'].includes(x.type))));if($('sort').value==='title')a.sort((x,y)=>x.title.localeCompare(y.title));else a.sort((x,y)=>($('sort').value==='old'?1:-1)*(new Date(x.created)-new Date(y.created)));$('list').innerHTML=a.length?a.map(x=>`<button role="option" aria-selected="${x.id===selected}" class="item ${x.id===selected?'active':''}" data-id="${x.id}"><span class="line"><strong>${esc(x.title)}</strong><span class="pill ${cls(x.type)}">${esc(x.type)}</span></span><p>${esc(x.summary)}</p><span class="line"><small>${esc(x.author)} · ${dt(x.created)}</small><small>${esc(x.status)} · ${esc(x.priority)}</small></span></button>`).join(''):'<div class="empty">Aucun résultat avec ces filtres.</div>';$('list').querySelectorAll('[data-id]').forEach(n=>n.onclick=()=>{selected=n.dataset.id;renderDetail();list()})}function renderDetail(){let x=entries.find(x=>x.id===selected);if(!x)return;$('detailHeader').innerHTML=`<div class="detail-head"><div><span class="pill ${cls(x.type)}">${esc(x.type)}</span><h2>${esc(x.title)}</h2><div class="muted">${esc(x.id)} · Créé le ${dt(x.created)} par <button class="author" id="authorLink">${esc(x.author)}</button></div></div><span class="pill">${esc(x.status)}</span></div>`;$('authorLink').onclick=()=>showProfile(x);$('detail').innerHTML=`<h3>Description initiale</h3><p>${esc(x.body)}</p><h3>Contexte</h3><p>${esc(x.context||'Non renseigné')}</p><h3>Pièces jointes (${x.attachments.length})</h3>${x.attachments.length?x.attachments.map(a=>`<div class="attachment">📄 <strong>${esc(a.name)}</strong><span>${esc(a.size)} · illustration</span></div>`).join(''):'<p class="muted">Aucune pièce jointe.</p>'}<button class="secondary" id="attach">＋ Joindre un fichier</button><div class="conversation"><h3>Conversation (${x.messages.length})</h3><p class="muted">Un fil chronologique unique. Les messages internes sont réservés au Workgroup.</p>${x.messages.map(m=>`<div class="message ${m.internal?'internal':''}"><div class="message-header"><span class="person">${esc(m.name)}</span><span class="pill ${m.internal?'support':'feedback'}">${m.internal?'Interne · Workgroup':'Public · utilisateurs autorisés'}</span></div><small class="muted">${esc(m.date)}</small><p>${esc(m.text)}</p></div>`).join('')}<div class="composer"><label for="comment" style="font-weight:700">Ajouter une réponse</label><textarea id="comment" placeholder="Écrire une réponse…"></textarea><div class="composer-footer"><label><input id="internal" type="checkbox"> Commentaire interne (Workgroup)</label><button class="primary" id="send">Publier</button></div></div></div>`;$('send').onclick=()=>{let t=$('comment').value.trim();if(!t)return;x.messages.push({name:'Membre Workgroup',internal:$('internal').checked,date:'Aujourd’hui',text:t});renderDetail()};$('attach').onclick=()=>showModal('Pièce jointe',`<p>Dans l’application finale, un fichier sera ajouté au message autorisé avec conservation des originaux et des révisions.</p><p class="muted">Aucun fichier n’est téléversé dans ce prototype.</p>`);$('meta').innerHTML=`<div class="group"><label for="editType">Type d’action / contribution</label><select class="field" id="editType">${kinds.map(y=>`<option ${x.type===y?'selected':''}>${esc(y)}</option>`).join('')}</select><div class="helper">Classification Workgroup proposée, à spécifier côté métier.</div></div><div class="group"><label for="editStatus">Statut</label><select class="field" id="editStatus">${['Nouveau','En cours','Fermé'].map(y=>`<option ${x.status===y?'selected':''}>${y}</option>`).join('')}</select><div class="helper">Transitions libres entre tous les statuts.</div></div><div class="group"><label for="editPriority">Priorité</label><select class="field" id="editPriority">${['Basse','Normale','Haute'].map(y=>`<option ${x.priority===y?'selected':''}>${y}</option>`).join('')}</select></div><div class="group"><label>Créé par</label><button class="profile" id="profile"><strong>${esc(x.author)} ↗</strong><small>${esc(x.profile)} · Voir le profil</small></button><div class="helper">Aucune catégorisation par équipe.</div></div><div class="group"><label>Date de création</label><strong>${dt(x.created)}</strong></div><div class="group"><label>Objet métier associé</label>${x.links.length?x.links.map(o=>`<button class="related" data-related="${esc(o.id)}">↗ ${esc(o.label)}<br><small class="muted">${esc(o.id)}</small></button>`).join(''):'<div class="side-note">Aucun objet lié pour le moment.</div>'}<button class="secondary" id="link">＋ Associer une Task ou solution</button></div><div class="side-note">Les liens métier sont contextuels. Aucun ticket de support, étude, Task ou statut supplémentaire n’est créé automatiquement.</div>`;for(let [id,key] of [['editType','type'],['editStatus','status'],['editPriority','priority']])$(id).onchange=e=>{x[key]=e.target.value;stats();tabs();list();renderDetail()};$('profile').onclick=()=>showProfile(x);$('link').onclick=()=>showModal('Associer un objet',`<p>La future intégration proposera une recherche d’objets autorisés (Task, composant, solution mesurée), avec épinglage de leur révision selon le contrat existant.</p>`);document.querySelectorAll('[data-related]').forEach(e=>e.onclick=()=>showModal('Contexte associé',`<p>${esc(e.textContent)}</p><p>Navigation simulée : le produit utilisera sa route réelle, ses permissions et son historique.</p>`))}function showModal(title,content){$('modalHost').innerHTML=`<div class="modal-back"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">${esc(title)}</h2>${content}<footer><button class="secondary" id="close">Fermer</button></footer></div></div>`;$('close').onclick=closeModal;document.addEventListener('keydown',escapeModal);$('close').focus()}function closeModal(){$('modalHost').innerHTML='';document.removeEventListener('keydown',escapeModal)}function escapeModal(e){if(e.key==='Escape')closeModal()}function showProfile(x){showModal('Profil · '+x.author,`<p><strong>Identifiant :</strong> ${esc(x.profile)}</p><p>Vue contextuelle du compte utilisateur. Les informations de profil autorisées seront récupérées depuis l’annuaire existant ; aucune notion d’équipe n’est ajoutée ici.</p>`)}$('new').onclick=()=>{$('modalHost').innerHTML=`<div class="modal-back"><form class="modal" id="create" role="dialog" aria-modal="true" aria-labelledby="newTitle"><h2 id="newTitle">Nouvelle contribution</h2><p class="muted">Le Workgroup peut initier lui-même une discussion ou un besoin.</p><label for="newTitleInput">Titre</label><input class="field" id="newTitleInput" required maxlength="140"><label for="newType">Type d’action</label><select class="field" id="newType">${kinds.map(x=>`<option>${x}</option>`).join('')}</select><label for="newDesc">Description</label><textarea class="field" id="newDesc" required></textarea><label for="newVis">Visibilité initiale</label><select class="field" id="newVis"><option>Public</option><option>Interne</option></select><p class="helper">Cette visibilité s’applique à la discussion initiale. La correction/modération conserve l’historique original.</p><footer><button class="secondary" type="button" id="cancel">Annuler</button><button class="primary" type="submit">Créer</button></footer></form></div>`;$('cancel').onclick=()=>{$('modalHost').innerHTML=''};$('create').onsubmit=e=>{e.preventDefault();let id='thr-'+String(entries.length+1).padStart(3,'0');entries.unshift({id,title:$('newTitleInput').value.trim(),type:$('newType').value,status:'Nouveau',priority:'Normale',created:new Date().toISOString(),author:'Membre Workgroup',profile:'usr-self',summary:$('newDesc').value.trim().slice(0,115),body:$('newDesc').value.trim(),context:'',links:[],attachments:[],messages:[{name:'Membre Workgroup',internal:$('newVis').value==='Interne',date:'Aujourd’hui',text:$('newDesc').value.trim()}]});selected=id;$('modalHost').innerHTML='';render()};$('newTitleInput').focus()};function render(){stats();tabs();list();renderDetail()}kinds.forEach(x=>$('typeFilter').insertAdjacentHTML('beforeend',`<option>${esc(x)}</option>`));['search','typeFilter','statusFilter','priorityFilter','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',list));render();
</script></body></html>
