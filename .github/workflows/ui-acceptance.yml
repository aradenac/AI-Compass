name: UI QA — Chromium acceptance

# No paths filter: the required check must never silently disappear for UI changes.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-qa-${{ github.event.pull_request.number || github.ref }}
  # Do not cancel main's immutable validation records.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui-qa:
    name: ui-qa
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-ui-qa.txt
      - name: Verify same-origin frontend asset and Caddy mount parity
        run: python3 scripts/verify_frontend_assets.py
      - name: Cache pinned Chromium browser download
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-22.04-1.56.0
      - name: Install pinned Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check -r scripts/requirements-ui-qa.txt
          python -m playwright install --with-deps chromium
      - name: Pull public container images through the existing mirror
        run: bash scripts/ci-pull-images.sh
      - name: Start disposable real Server and independent standalone Demo
        run: |
          set -euo pipefail
          python3 scripts/init-env.py
          docker compose up -d --build --wait
          docker compose exec -T api python manage.py migrate --noinput
          python3 -m http.server 8090 --bind 127.0.0.1 --directory . > /tmp/uxqa-static-server.log 2>&1 &
          echo $! > "$RUNNER_TEMP/uxqa-static-server.pid"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health > /dev/null &&
               curl -fsS http://127.0.0.1:8090/prototype.html > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/health
          curl --fail --silent --show-error http://127.0.0.1:8090/prototype.html -o /dev/null
      - name: Provision disposable independent role fixtures
        run: |
          python3 scripts/ux_qa.py provision --output "$RUNNER_TEMP/uxqa-credentials.json"
      - name: Run real browser journeys, mutation probes and capture visual evidence
        run: |
          python3 scripts/ux_qa.py test \
            --base-url http://127.0.0.1:8080 \
            --demo-url http://127.0.0.1:8090/prototype.html \
            --credentials "$RUNNER_TEMP/uxqa-credentials.json" \
            --artifacts "$RUNNER_TEMP/ux-qa"
      - name: Publish structured UI acceptance report
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/ux-qa/report.md"; then
            cat "$RUNNER_TEMP/ux-qa/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Browser suite failed before generating its report. See job logs; UI acceptance NOT certified." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain screenshots, Chromium traces and structured report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ux-qa/
          if-no-files-found: warn
          retention-days: 30
      - name: Diagnose environment on failure (no secrets)
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail=50 web api || true
      - name: Stop isolated containers and static demo server
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/uxqa-static-server.pid"; then
            kill "$(cat "$RUNNER_TEMP/uxqa-static-server.pid")" || true
          fi
          docker compose down --volumes --remove-orphans || true
