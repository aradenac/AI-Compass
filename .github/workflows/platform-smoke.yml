name: Platform Demo + Server smoke

on:
  push:
    paths:
      - "backend/**"
      - "scripts/**"
      - "staging/**"
      - "docs/migration-staging.md"
      - "compose.yaml"
      - "Caddyfile"
      - "prototype.html"
      - "server-mode.js"
      - "server-tasks.js"
      - "server-users.js"
      - "server-activity.js"
      - "server-data-health.js"
      - "model-catalog.js"
      - ".env.example"
      - ".github/workflows/platform-smoke.yml"
  pull_request:
    paths:
      - "backend/**"
      - "scripts/**"
      - "compose.yaml"
      - "Caddyfile"
      - "prototype.html"
      - "server-mode.js"
      - "server-tasks.js"
      - "server-users.js"
      - "server-activity.js"
      - "server-data-health.js"
      - "model-catalog.js"
      - ".env.example"
      - ".github/workflows/platform-smoke.yml"
  workflow_dispatch:

jobs:
  demo-and-server:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Use cached public image mirror on hosted CI
        run: |
          sudo install -d -m 0755 /etc/docker
          echo '{"registry-mirrors":["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig.Mirrors}}'
          # Explicit public ECR pulls avoid Docker Hub rate-limit fallback.
          for image in postgres:17-alpine caddy:2-alpine python:3.12-slim busybox:1.36; do
            success=false
            for attempt in 1 2 3 4 5; do
              if docker pull "public.ecr.aws/docker/library/$image"; then
                success=true
                break
              fi
              sleep $((attempt * 6))
            done
            if test "$success" != true; then
              echo "ECR pull failed for $image after retries" >&2
              exit 1
            fi
            docker tag "public.ecr.aws/docker/library/$image" "$image"
          done
      - name: Validate recovery code and failure-path unit tests
        run: |
          python3 -m py_compile scripts/recovery.py scripts/install-backup-timer.py scripts/test_recovery.py scripts/smoke_recovery_domain.py scripts/smoke_catalog.py scripts/smoke_evidence.py scripts/migration_promote.py scripts/test_migration_promote.py
          python3 -m unittest discover -s scripts -p 'test_recovery.py' -v
          python3 -m unittest discover -s scripts -p 'test_full_recovery.py' -v
          python3 -m unittest discover -s scripts -p 'test_migration_stage.py' -v
          python3 -m unittest discover -s scripts -p 'test_migration_promote.py' -v
          python3 scripts/install-backup-timer.py --destination "$PWD" --dry-run | grep 'ai-compass-backup.service'
      - name: Create isolated local credentials
        run: python3 scripts/init-env.py
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start server infrastructure
        run: docker compose up -d --wait --build
      - name: Initialize Django's baseline schema
        run: docker compose run --rm api python manage.py migrate --noinput
      - name: Assert fresh Server has no seeded business data
        run: |
          docker compose exec -T api python manage.py shell -c \
            'from config.models import CatalogItem, CatalogRevision, CatalogAuditEvent; assert CatalogItem.objects.count() == 0 and CatalogRevision.objects.count() == 0 and CatalogAuditEvent.objects.count() == 0, "Fresh Server must not seed any Models or revisions"'
      - name: Initialize separate operator and maintainer roles
        run: |
          docker compose exec -T api python manage.py bootstrap_identity
          operator_pw=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
          maintainer_pw=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
          printf '%s\n' "$operator_pw" | docker compose exec -T api python manage.py bootstrap_identity --username ci-operator --role platform-admin --password-stdin
          printf '%s\n' "$maintainer_pw" | docker compose exec -T api python manage.py bootstrap_identity --username ci-maintainer --role data-maintainer --password-stdin
          AI_COMPASS_TEST_PASSWORD="$maintainer_pw" python3 scripts/smoke-auth.py ci-maintainer
          contributor_pw=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
          printf '%s\n' "$contributor_pw" | docker compose exec -T api python manage.py bootstrap_identity --username ci-contributor --role contributor --password-stdin
          AI_COMPASS_TEST_PASSWORD="$contributor_pw" python3 scripts/smoke-models.py ci-contributor
          AI_COMPASS_TEST_PASSWORD="$contributor_pw" python3 scripts/smoke_catalog.py ci-contributor
          AI_COMPASS_TEST_PASSWORD="$contributor_pw" python3 scripts/smoke_evidence.py ci-contributor
          docker compose exec -T api python manage.py reconcile_evidence --json
      - name: Check that catalog ORM models match checked-in migrations
        run: docker compose exec -T api python manage.py makemigrations --check --dry-run
      - name: Validate staging-only registered migration in Django test database
        run: docker compose exec -T api python manage.py test config.test_migration_staging -v 1
      - name: Verify Users & Access permission, CSRF and audit boundaries
        run: docker compose exec -T api python manage.py test config.test_user_admin -v 2
      - name: Verify production migration gate, immutable receipts and crash-safe replay
        run: docker compose exec -T api python manage.py test config.test_schema_promotion -v 2
      - name: Verify Activity Feed permissions, audit correlation and exports
        run: docker compose exec -T api python manage.py test config.test_activity -v 2
      - name: Verify maintenance-only health scans, access isolation and immutable triage
        run: docker compose exec -T api python manage.py test config.test_data_health -v 2
      - name: Verify task taxonomy ancestry, version history and permissions
        run: docker compose exec -T api python manage.py test config.test_tasks -v 2
      - name: Run backend, persistence and backup/restore checks
        run: bash scripts/smoke-platform.sh
      - name: Verify DB-only recovery manifest flags uncovered evidence files
        run: |
          python3 scripts/recovery.py status --json | python3 -c '
          import json,sys
          p=json.load(sys.stdin)["last_good_backup"]
          assert p["evidence"]["included"] is False
          assert p["evidence"]["requires_coordinated_restore"] is True
          assert p["evidence"]["blob_count"] == 1
          assert p["evidence"]["link_count"] == 2
          assert len(p["evidence"]["blob_hashes"]) == 1
          '
      - name: Verify coordinated DB and evidence recovery entirely offline
        env:
          AI_COMPASS_FULL_RECOVERY_CI: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/aic-full"
          dump=$(python3 scripts/full_recovery.py --destination "$RUNNER_TEMP/aic-full" --allow-local-ci backup --keep 2)
          python3 scripts/full_recovery.py verify "$dump" | python3 -c 'import json,sys; a=json.load(sys.stdin); assert a["status"]=="verified" and a["blob_count"]==1'
          # Neither production DB nor evidence volumes are needed for a recovery drill.
          docker compose stop api db
          python3 scripts/full_recovery.py drill "$dump" > "$RUNNER_TEMP/full-restore-report.json"
          python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/full-restore-report.json")); assert d["status"]=="passed" and d["restored"]["api_download"]=="passed"; assert d["restored"]["inspection"]["evidence_db_references"]["link_count"]==2'
          docker compose start db api
          python3 scripts/full_recovery.py --destination "$RUNNER_TEMP/aic-full" status > "$RUNNER_TEMP/full-status.json"
          python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/full-status.json")); assert d["status"]=="ok" and d["last_successful_restore"]["status"]=="passed"'
          cp "$dump.blobs.tar" "$RUNNER_TEMP/valid.tar"
          printf 'tamper' | dd of="$dump.blobs.tar" bs=1 seek=500 conv=notrunc status=none
          if python3 scripts/full_recovery.py verify "$dump"; then
            echo "CORRUPTED EVIDENCE ARCHIVE ACCEPTED" >&2; exit 1
          fi
          mv "$RUNNER_TEMP/valid.tar" "$dump.blobs.tar"
          python3 scripts/full_recovery.py verify "$dump"
          if python3 scripts/full_recovery.py --destination "$RUNNER_TEMP/missing-mount" backup; then
            echo "UNAVAILABLE BACKUP DESTINATION ACCEPTED" >&2; exit 1
          fi
      - name: Isolate, reject and recreate a full staged migration candidate twice
        env:
          AI_COMPASS_FULL_RECOVERY_CI: "1"
        run: |
          set -x
          # A historical v1 record remains unmodified on the original operational CI Server.
          docker compose exec -T api python manage.py shell -c '
          from django.contrib.auth import get_user_model
          from config.models import CatalogItem,CatalogRevision,CatalogAuditEvent,ObjectTypeVersion
          user=get_user_model().objects.get(username="ci-contributor")
          item=CatalogItem.objects.create(type_slug="model",public_id="mdl-staging-test-canary")
          rev=CatalogRevision.objects.create(item=item,number=1,schema_version=ObjectTypeVersion.objects.get(type_slug="model",version=1),display_name="Historical staging candidate",properties={"release_channel":"preview","vendor_extension":{"unknown":None}},created_by=user)
          item.current_revision=rev; item.save(update_fields=["current_revision"])
          CatalogAuditEvent.objects.create(item=item,revision=rev,actor=user,action="created")
          '
          mkdir -p "$RUNNER_TEMP/stage-backups"
          dump=$(python3 scripts/full_recovery.py --destination "$RUNNER_TEMP/stage-backups" --allow-local-ci backup)
          python3 scripts/migration_stage.py create --snapshot "$dump" > "$RUNNER_TEMP/stage1.json"
          candidate=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["automated_checks"]=="passed" and d["migrated"]["changed"]==1; print(d["candidate_id"])' "$RUNNER_TEMP/stage1.json")
          curl -fsS "http://127.0.0.1:18081/?mode=server" | grep -q '/banner.js'
          curl -fsS http://127.0.0.1:18081/banner.js | grep -q "NOT PRODUCTION"
          curl -fsS http://127.0.0.1:18081/server-mode.js | cmp - server-mode.js
          curl -fsS http://127.0.0.1:18081/server-tasks.js | cmp - server-tasks.js
          curl -fsS http://127.0.0.1:18081/server-users.js | cmp - server-users.js
          curl -fsS http://127.0.0.1:18081/server-activity.js | cmp - server-activity.js
          curl -fsS http://127.0.0.1:18081/server-data-health.js | cmp - server-data-health.js
          curl -fsS http://127.0.0.1:18081/api/v1/health | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["status"]=="ok" and x["database"]=="ok"'
          if python3 scripts/migration_stage.py verdict "$candidate" accepted --notes "Missing manual frontend acceptance"; then
            echo "UNREVIEWED STAGE ACCEPTED" >&2; exit 1
          fi
          python3 scripts/migration_stage.py verdict "$candidate" rejected --notes "CI deliberately tests rejection" > /dev/null
          python3 scripts/migration_stage.py recreate "$candidate" > "$RUNNER_TEMP/stage2.json"
          candidate2=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["automated_checks"]=="passed" and d["migrated"]["changed"]==1; print(d["candidate_id"])' "$RUNNER_TEMP/stage2.json")
          test "$candidate" != "$candidate2"
          python3 scripts/migration_stage.py recreate "$candidate2" > "$RUNNER_TEMP/stage3.json"
          candidate3=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["automated_checks"]=="passed" and d["migrated"]["changed"]==1; print(d["candidate_id"])' "$RUNNER_TEMP/stage3.json")
          test "$candidate2" != "$candidate3"
          python3 scripts/migration_stage.py discard "$candidate3" > /dev/null
          docker compose exec -T api python manage.py shell -c '
          from config.models import CatalogItem
          item=CatalogItem.objects.get(public_id="mdl-staging-test-canary")
          assert item.current_revision.number==1 and item.current_revision.schema_version.version==1
          assert item.current_revision.properties["vendor_extension"]=={"unknown":None}
          '
          python3 -c 'from pathlib import Path; import json,sys; r=json.loads((Path(".local/staging")/sys.argv[1]/"report.json").read_text()); assert r["status"]=="discarded" and r["verdict"]["decision"]=="rejected"' "$candidate"
          python3 scripts/full_recovery.py verify "$dump" > /dev/null
      - name: Restore real Models from an entirely disposable CI database
        env:
          AI_COMPASS_ISOLATED_FIXTURE_CI: "1"
        run: python3 scripts/smoke_recovery_domain.py
      - name: Check shared frontend modes and client syntax
        run: |
          node --check server-mode.js
          node --check server-tasks.js
          node --check server-users.js
          node scripts/test-server-users.js
          node --check server-activity.js
          node --check server-data-health.js
          node scripts/test-server-data-health.js
          node scripts/test-server-activity.js
          node scripts/test-server-tasks.js
          node --check model-catalog.js
          node --check scripts/test-model-catalog.js
          node --check scripts/test-catalog-types.js
          node scripts/test-model-catalog.js
          node scripts/test-catalog-types.js
          python3 - <<'PY'
          from pathlib import Path
          page = Path("prototype.html").read_text()
          script = Path("server-mode.js").read_text()
          models = Path("model-catalog.js").read_text()
          assert '<script src="model-catalog.js"></script>' in page
          assert "ApiDataProvider" in models and "LocalStorageDataProvider" in models
          assert 'window.location.pathname === "/maintenance"' in page
          assert 'get("mode") !== "demo"' in page
          assert '<script src="server-mode.js"></script>' in page
          assert '<script src="server-tasks.js"></script>' in page
          assert '<script src="server-users.js"></script>' in page
          assert '<script src="server-activity.js"></script>' in page
          assert '<script src="server-data-health.js"></script>' in page
          assert 'localStorage' not in script or 'localStorage' in script.splitlines()[0]  # only explanatory comments may mention it
          PY
          curl -fsS http://127.0.0.1:8080/server-mode.js | cmp - server-mode.js
          curl -fsS http://127.0.0.1:8080/server-tasks.js | cmp - server-tasks.js
          curl -fsS http://127.0.0.1:8080/server-users.js | cmp - server-users.js
          curl -fsS http://127.0.0.1:8080/server-activity.js | cmp - server-activity.js
          curl -fsS http://127.0.0.1:8080/server-data-health.js | cmp - server-data-health.js
          curl -fsS http://127.0.0.1:8080/model-catalog.js | cmp - model-catalog.js

      - name: Verify the same frontend also runs without any backend
        run: |
          docker compose stop
          python3 -m http.server 8090 --bind 127.0.0.1 --directory . &
          demo_pid=$!
          trap 'kill "$demo_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8090/prototype.html > /tmp/ai-compass-demo.html && break
            sleep 1
          done
          cmp prototype.html /tmp/ai-compass-demo.html
          grep -q "AI Compass" /tmp/ai-compass-demo.html
      - name: Verify Docker volume survives container recreation
        run: |
          docker compose down
          docker compose up -d --wait
          marker=$(docker compose exec -T db sh -ec 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "SELECT marker FROM ai_compass_smoke_marker LIMIT 1"' | tr -d '\r\n')
          test "$marker" = "persistence-check"
      - name: Inspect state on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail 100 || true
      - name: Stop containers (retain volumes until runner cleanup)
        if: always()
        run: docker compose down || true
