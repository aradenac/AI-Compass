name: ai-compass

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - internal

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      AI_COMPASS_EVIDENCE_ROOT: /var/lib/ai-compass/evidence
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
    volumes:
      - evidence:/var/lib/ai-compass/evidence
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - internal

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AI_COMPASS_HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./prototype.html:/srv/frontend/prototype.html:ro
      - ./server-mode.js:/srv/frontend/server-mode.js:ro
      - ./server-tasks.js:/srv/frontend/server-tasks.js:ro
      - ./server-test-cases.js:/srv/frontend/server-test-cases.js:ro
      - ./server-guides.js:/srv/frontend/server-guides.js:ro
      - ./server-watch.js:/srv/frontend/server-watch.js:ro
      - ./server-forecasts.js:/srv/frontend/server-forecasts.js:ro
      - ./server-results.js:/srv/frontend/server-results.js:ro
      - ./server-recommendations.js:/srv/frontend/server-recommendations.js:ro
      - ./server-campaigns.js:/srv/frontend/server-campaigns.js:ro
      - ./server-sessions.js:/srv/frontend/server-sessions.js:ro
      - ./server-users.js:/srv/frontend/server-users.js:ro
      - ./server-activity.js:/srv/frontend/server-activity.js:ro
      - ./server-data-health.js:/srv/frontend/server-data-health.js:ro
      - ./model-catalog.js:/srv/frontend/model-catalog.js:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

volumes:
  pgdata:
  evidence:

networks:
  internal:
    driver: bridge
