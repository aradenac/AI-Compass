<style>

.side-foot{margin-top:auto;border-top:1px solid #31415a;padding:18px 9px 0}.side-foot .demo{font-size:11px;line-height:1.5;color:#9eb1c9}.side-foot button{margin-top:10px;background:#233652;border:1px solid #455876;color:#d7e1f3;border-radius:8px;padding:8px 12px;width:100%;text-align:left}

table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:11px 10px;vertical-align:top}th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:750;background:#fafbfe}tr:last-child td{border:0}.table-wrap{overflow:auto;max-width:100%}td .btn{margin-right:4px}.score{font-weight:850;font-variant-numeric:tabular-nums;color:#236e6d}.score.low{color:var(--red)}.score.mid{color:var(--yellow)}.metric{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:11px 0 5px;font-size:12px}.bar{width:100%;height:7px;border-radius:10px;background:#e8edf5;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#38b8bb,#4b6ad4);border-radius:10px}.bar.warn i{background:#eab16f}.pill-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:17px}.tab{border:0;background:transparent;padding:10px 13px;color:var(--muted);border-bottom:2px solid transparent;font-weight:650}.tab.active{color:var(--blue);border-color:var(--blue)}.solution-card{display:flex;flex-direction:column;gap:11px;height:100%}.solution-title{display:flex;gap:10px;justify-content:space-between;align-items:start}.solution-icon{width:42px;height:42px;flex-shrink:0;display:grid;place-items:center;border-radius:11px;background:#eef2ff;color:#405aba;font-size:18px;font-weight:850}.solution-foot{border-top:1px solid var(--line);padding-top:12px;margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:7px}.text-block{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#f5f7fc;border:1px solid var(--line);padding:13px;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.timeline{border-left:2px solid #dde7f2;padding-left:19px}.event{position:relative;padding-bottom:19px}.event:before{content:"";position:absolute;left:-25px;top:3px @media(max-width:1150px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}}@media(max-width:780px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;padding:15px;gap:10px}.sidebar .nav-area{display:flex;overflow:auto;gap:4px}.nav-group{display:flex;gap:2px;margin:0}.nav-label,.side-foot{display:none}.nav-link{width:auto;white-space:nowrap;padding:9px}.nav-link .nav-icon{display:none}.topbar{height:auto;min-height:62px;padding:10px 18px}.content{padding:22px 16px 45px}.g2,.g3,.g4{grid-template-columns:1fr}.page-head{display:block}.head-actions{margin-top:16px}.form-grid{grid-template-columns:1fr}.span2{grid-column:auto}.login-users{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
