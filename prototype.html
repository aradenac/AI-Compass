function transitionQualification(id,direction){

  var s=rec("solutions",q.solution),rs=qualificationRuns(q);

 }else if(q.stage==="to_qualify"&&!q.solution&&!q.candidate?.model){toast("Select a model candidate before qualifying.");return;}

if(act==="export"){var out=canEdit()?db:Object.assign({},db,{solutions:db.solutions.filter(visibleSolution),components:db.components.filter(function(c){return !c.publication||c.publication==="published";}),runs:db.runs.filter(visibleRun).map(publicRunRecord),guides:db.guides.filter(function(g){return g.status==="published";}),events:db.events.filter(function(e){return !e.internal;}).map(publicActivityEvent),watch:db.watch.filter(watchVisible),researchEvidence:db.researchEvidence.filter(researchVisible),watchSourceLinks:db.watchSourceLinks.filter(function(l){return watchVisible(rec("watch",l.watch))&&researchVisible(rec("researchEvidence",l.source));}),feedbackMessages:db.feedbackMessages.filter(function(m){return m.visibility==="public";}),proposals:db.proposals.filter(function(p){return p.status==="published";}),campaigns:db.campaigns.filter(function(c){return !c.archived&&c.stage==="published";}).map(publicCampaignRecord),campaignTrials:[],qualifications:[],revisions:[]});var blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"});var link=document.createElement("a");link.href=URL.createObjectURL(blob);link.download="ai-compass-demo-data.json";link.click();setTimeout(function(){URL.revokeObjectURL(link.href);},2000);toast(canEdit()?"Exported full mock dataset.":"Exported published mock records.");return;}
if(act==="reset"){if(confirm("Replace all browser-saved prototype data with the initial mock dataset? This cannot be undone.")){db=seed();ensureDefaults();persist();ui.modal="";ui.filters={};ui.page="dashboard";render();toast("Mock dataset restored.");}return;}
});
document.addEventListener("click",function(ev){
 if(ev.target&&ev.target.id==="backdrop"&&!modalContainsForm())closeModal();
});
document.addEventListener("change",function(ev){
if(ev.target&&ev.target.id==="importFile"){
 if(!canEdit())return;
 var file=ev.target.files&&ev.target.files[0];if(!file)return;
 var reader=new FileReader();
 reader.onload=function(){
  try{var restored=JSON.parse(reader.result);if(!restored||!Array.isArray(restored.tasks)||!Array.isArray(restored.solutions)||!Array.isArray(restored.runs)||!Array.isArray(restored.users))throw Error("Invalid AI Compass data format");
   if(!confirm("Replace the current local demo dataset with the imported JSON?"))return;
   db=restored;ensureDefaults();persist();ui.modal="";ui.page="dashboard";render();toast("Imported local dataset.");
  }catch(ex){toast("Import failed: "+ex.message);}
 };
 reader.readAsText(file);
 ev.target.value="";
}
});

/* Drag only by the dedicated handle; explicitly separated drop zones allow
   reparenting, inserting before a sibling and moving sections at root level. */
function taskDropTarget(element){
 if(!element||!element.closest)return null;
 return element.closest("[data-drop-parent], [data-drop-inside]");
}
function resetTaskDropStyle(){
 if(!document.querySelectorAll)return;
 document.querySelectorAll(".organizer-drop.drop-active, .organizer-node-row.drop-inside").forEach(function(el){el.classList.remove("drop-active","drop-inside");});
}
document.addEventListener("dragstart",function(ev){
 var handle=ev.target&&ev.target.closest&&ev.target.closest("[data-task-drag]");
 if(!handle||!canEdit()||ui.taskView!=="organize")return;
 ui.draggedTask=handle.dataset.taskDrag;
 if(ev.dataTransfer){ev.dataTransfer.effectAllowed="move";ev.dataTransfer.setData("text/plain",ui.draggedTask);}
 handle.classList.add("dragging");
 var app=document.getElementById("app");if(app&&app.classList)app.classList.add("organizing-drag");
});
document.addEventListener("dragover",function(ev){
 if(!ui.draggedTask||!canEdit()||ui.taskView!=="organize")return;
 var target=taskDropTarget(ev.target);if(!target)return;
 var parent=target.hasAttribute("data-drop-inside")?target.dataset.dropInside:(target.dataset.dropParent||null),
     before=target.hasAttribute("data-drop-inside")?"":target.dataset.dropBefore||"";
 if(!isValidTaskMove(ui.draggedTask,parent,before))return;
 ev.preventDefault();
 if(ev.dataTransfer)ev.dataTransfer.dropEffect="move";
 resetTaskDropStyle();target.classList.add(target.hasAttribute("data-drop-inside")?"drop-inside":"drop-active");
});
document.addEventListener("drop",function(ev){
 if(!ui.draggedTask||!canEdit()||ui.taskView!=="organize")return;
 var target=taskDropTarget(ev.target),dragId=ui.draggedTask;
 if(!target){ui.draggedTask="";resetTaskDropStyle();var app=document.getElementById("app");if(app&&app.classList)app.classList.remove("organizing-drag");return;}
 ev.preventDefault();
 var parent=target.hasAttribute("data-drop-inside")?target.dataset.dropInside:target.dataset.dropParent||null,
     before=target.hasAttribute("data-drop-inside")?"":target.dataset.dropBefore||"";
 ui.draggedTask="";resetTaskDropStyle();var app=document.getElementById("app");if(app&&app.classList)app.classList.remove("organizing-drag");
 dropTaskOn(dragId,parent,before);
});
document.addEventListener("dragend",function(){
 ui.draggedTask="";resetTaskDropStyle();var app=document.getElementById("app");if(app&&app.classList)app.classList.remove("organizing-drag");
 if(document.querySelectorAll)document.querySelectorAll(".organizer-handle.dragging").forEach(function(el){el.classList.remove("dragging");});
});
document.addEventListener("keydown",function(ev){
 if(ev.key==="Escape"&&ui.modal&&!modalContainsForm())closeModal();
});
window.addEventListener("storage",function(ev){if(ev.key===KEY){try{db=JSON.parse(ev.newValue)||seed();render();}catch(ex){}}});
render();
