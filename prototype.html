.daily-kicker{display:flex;align-items:center;gap:9px;color:#0b777e;font-size:12px;font-weight:700}
.daily-board{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:13px;overflow-x:auto;padding-bottom:7px}

.daily-card{background:white;border:1px solid #e3e9f3;border-left:3px solid #c7d4e7;border-radius:9px;padding:13px;margin-bottom:10px;box-shadow:0 2px 10px #142f4b06}
.daily-card[data-stage="to_qualify"]{border-left-color:#7e96b5}.daily-card[data-stage="qualifying"]{border-left-color:#4d70d8}.daily-card[data-stage="review"]{border-left-color:#e5a754}.daily-card[data-stage="published"]{border-left-color:#3fa68f}
.daily-card h4{font-size:13px;margin:7px 0 4px}.daily-card .small{line-height:1.5}
.daily-card .inline-actions{margin-top:12px;gap:5px}
.daily-card .btn{white-space:normal}.daily-lane.empty-lane{min-height:140px}
.daily-scroll{max-height:390px;overflow:auto;padding-right:5px}
.daily-compact .list-row{padding:13px 0;align-items:flex-start}
.daily-compact .list-row .btn{flex-shrink:0}
.daily-info{background:#f5f8fc;border-radius:9px;padding:12px;font-size:12px;color:#496078}
@media(max-width:1250px){.daily-board{grid-template-columns:repeat(4,minmax(245px,1fr));}}

/* Interactive task organizer */
.organizer-intro{margin:0 0 16px}.organizer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,315px),1fr));gap:14px;align-items:start}

.organizer-mini:hover,.organizer-expander:hover,.organizer-handle:hover{background:#e8eff9;color:#3159d7}
.organizer-node-title{min-width:0;flex:1;background:none;border:0;text-align:left;color:#263a56;padding:5px 2px;font-weight:620;overflow-wrap:anywhere;font-size:12px}
.organizer-node-title:hover{color:var(--blue);text-decoration:underline}
.organizer-node-count{font-size:10px;color:#91a0b6;white-space:nowrap}
.organizer-drop{height:9px;border-radius:7px;margin:2px 0;position:relative;background:transparent;border:1px dashed transparent}
.organizer-drop span{display:none;pointer-events:none}
.organizer-drop.drop-active{height:36px;border:2px dashed #4a79db;background:#edf3ff;color:#3356a7;display:flex;align-items:center;justify-content:center;font-size:11px}
.organizer-drop.drop-active span{display:inline}
.organizer-root-drop{margin-bottom:4px}.organizer-root-drop .organizer-drop{height:16px}
.organizer-top-form{max-width:640px;margin-bottom:17px}

.organizing-drag .organizer-drop.drop-active{height:36px;border:2px dashed #4a79db;background:#e9f1ff;color:#3159d7}
.organizing-drag .organizer-node-row{border:1px dashed #dae4f4}
@media(max-width:780px){.organizer-grid{grid-template-columns:1fr}.organizer-node-row{flex-wrap:nowrap}.organizer-mini{min-width:21px}.organizer-intro{font-size:12px}}

.component-lane .list{max-height:620px;overflow:auto}.component-lane .list-row{align-items:flex-start}.component-lane .list-row p{margin-top:7px}.component-lane .card-head h2{font-size:19px}

 var task=rec("tasks",id),target=parent?rec("tasks",parent):null;
 if(!task||(parent&&!target)||id===parent||descendants(id).includes(parent))return false;
 if(before&&(before===id||!rec("tasks",before)||rec("tasks",before).parent!==(parent||null)))return false;
 return true;
}
function moveTaskNode(id,parent,before){
 if(!canEdit())return false;
 parent=parent||null;before=before||"";
 if(!isValidTaskMove(id,parent,before))return false;
 var item=rec("tasks",id),oldParent=item.parent||null,oldPosition=siblingOrder(oldParent).findIndex(function(x){return x.id===id;});
 var sourceSiblings=siblingOrder(oldParent).filter(function(x){return x.id!==id;});
 var destination=(oldParent===parent?sourceSiblings:siblingOrder(parent).slice());
 var insertAt=before?destination.findIndex(function(x){return x.id===before;}):destination.length;
 if(insertAt<0)return false;
 if(oldParent===parent&&oldPosition===insertAt)return false;
 var beforeRecord=JSON.parse(JSON.stringify(item));
 item.parent=parent;destination.splice(insertAt,0,item);
 if(oldParent!==parent)sourceSiblings.forEach(function(x,i){x.order=i;});
 destination.forEach(function(x,i){x.order=i;});
 revision("Task",id,beforeRecord,item);
 ui.expanded[parent||""]=true;ui.task=id;
 event("Task","Reorganized "+item.name+" under "+(parent?(rec("tasks",parent)?.name||"unknown"):"root sections"));
 persist();return true;
}

/* Drag only by the dedicated handle; explicitly separated drop zones allow
   reparenting, inserting before a sibling and moving sections at root level. */
function taskDropTarget(element){
 if(!element||!element.closest)return null;
 return element.closest("[data-drop-parent], [data-drop-inside]");
}
function resetTaskDropStyle(){
 if(!document.querySelectorAll)return;
 document.querySelectorAll(".organizer-drop.drop-active, .organizer-node-row.drop-inside").forEach(function(el){el.classList.remove("drop-active","drop-inside");});
}
document.addEventListener("dragstart",function(ev){
 var handle=ev.target&&ev.target.closest&&ev.target.closest("[data-task-drag]");
 if(!handle||!canEdit()||ui.taskView!=="organize")return;
 ui.draggedTask=handle.dataset.taskDrag;
 if(ev.dataTransfer){ev.dataTransfer.effectAllowed="move";ev.dataTransfer.setData("text/plain",ui.draggedTask);}
 handle.classList.add("dragging");
 var app=document.getElementById("app");if(app&&app.classList)app.classList.add("organizing-drag");
});
document.addEventListener("dragover",function(ev){
 if(!ui.draggedTask||!canEdit()||ui.taskView!=="organize")return;
 var target=taskDropTarget(ev.target);if(!target)return;
 var parent=target.hasAttribute("data-drop-inside")?target.dataset.dropInside:(target.dataset.dropParent||null),
     before=target.hasAttribute("data-drop-inside")?"":target.dataset.dropBefore||"";
 if(!isValidTaskMove(ui.draggedTask,parent,before))return;
 ev.preventDefault();
 if(ev.dataTransfer)ev.dataTransfer.dropEffect="move";
 resetTaskDropStyle();target.classList.add(target.hasAttribute("data-drop-inside")?"drop-inside":"drop-active");
});
document.addEventListener("drop",function(ev){
 if(!ui.draggedTask||!canEdit()||ui.taskView!=="organize")return;
 var target=taskDropTarget(ev.target),dragId=ui.draggedTask;
 if(!target){ui.draggedTask="";resetTaskDropStyle();var app=document.getElementById("app");if(app&&app.classList)app.classList.remove("organizing-drag");return;}
 ev.preventDefault();
 var parent=target.hasAttribute("data-drop-inside")?target.dataset.dropInside:target.dataset.dropParent||null,
     before=target.hasAttribute("data-drop-inside")?"":target.dataset.dropBefore||"";
 ui.draggedTask="";resetTaskDropStyle();var app=document.getElementById("app");if(app&&app.classList)app.classList.remove("organizing-drag");
 dropTaskOn(dragId,parent,before);
});
document.addEventListener("dragend",function(){
 ui.draggedTask="";resetTaskDropStyle();var app=document.getElementById("app");if(app&&app.classList)app.classList.remove("organizing-drag");
 if(document.querySelectorAll)document.querySelectorAll(".organizer-handle.dragging").forEach(function(el){el.classList.remove("dragging");});
});
