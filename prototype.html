}
function taskEvidence(id){
var rs=runsForTask(id,true),cases=db.cases.filter(function(c){return descendants(id).includes(c.task);}),solutions=db.solutions.filter(function(s){return rs.some(function(r){return r.solution===s.id;});});
var rows=solutions.map(function(s){var own=rs.filter(function(r){return r.solution===s.id;}),stats=solutionStats(s.id,own),total=cases.length,tested=new Set(own.map(function(r){return r.case;})).size;return '<tr>'+td(linkAction(s.name,"solution",s.id))+td('<span class="score'+(stats.score<75?' low':stats.score<85?' mid':'')+'">'+stats.score+'/100</span>')+td(stats.accept+"%")+td(tested+"/"+total+" cases")+td(stats.effort+" min")+td(money(stats.cost))+td(btn("Runs","benchSolution",s.id,"sm"))+'</tr>';});
return rs.length?simpleTable(["AI solution","Mean score","Accepted","Coverage","Human effort","AI cost/run",""],rows):'<div class="empty">No published benchmark runs yet for this branch.<br>Workgroup members can add a Test Case and record a run.</div>';
}
function tasksPage(){
var t=rec("tasks",ui.task)||db.tasks[0];ui.task=t.id;var cases=db.cases.filter(function(c){return descendants(t.id).includes(c.task);}),path=ancestors(t.id);
var criteria=path.filter(function(x){return x.criteria;}).map(function(x){return '<div class="list-row"><div><strong>'+E(x.name)+'</strong><div class="muted small">'+E(x.criteria)+'</div></div></div>';}).join("");
var details='<div class="card-head"><div><div class="eyebrow">'+E(t.phase)+' · '+E(t.domain)+'</div><h2>'+E(t.name)+'</h2></div>'+badge(cases.length+" cases")+'</div><p class="muted">'+E(t.desc)+'</p><div class="tags" style="margin-top:13px">'+path.map(function(x){return badge(x.name);}).join("")+'</div><hr class="divider"><div class="row-between"><h3>Definition of Done / expectations</h3>'+(t.baseline?'<span class="tag">Engineer baseline: '+t.baseline+' min</span>':'')+'</div><p class="small" style="margin-top:8px">'+E(t.criteria)+'</p><details style="margin-top:14px"><summary class="pointer small">Show inherited context from ancestors</summary><div class="list">'+criteria+'</div></details><hr class="divider"><div class="row-between"><h3>Attached test cases ('+cases.length+')</h3>'+(canEdit()?btn("+ Add test case","newCase",t.id,"sm"):"")+'</div><div class="list" style="margin-top:9px">'+(cases.map(function(c){return '<div class="list-row"><div>'+linkAction(c.title,"caseDetail",c.id)+'<div class="muted small">'+E(rec("tasks",c.task)?.name||"")+' · '+E(c.objective)+'</div></div>'+badge(c.version)+'</div>';}).join("")||'<p class="muted small">No cases under this branch.</p>')+'</div><hr class="divider"><h3>Evidence-based solution comparison</h3><p class="muted small" style="margin:6px 0 12px">Aggregated published runs under this node; untested cases are not failures. Inspect the Test Cases and runs before making a decision.</p>'+taskEvidence(t.id);
return heading("Explore","Engineering task hierarchy","An evolving, arbitrary-depth tree. Test Cases are experimental challenges attached to tasks, not branches of the taxonomy.",canEdit()?btn("+ New task node","newTask",t.id,"primary"):"")+ '<div class="split"><section class="card"><div class="card-head"><h2>Task taxonomy</h2>'+badge(db.tasks.length+" nodes")+'</div><div class="tree">'+treeHtml(null,0)+'</div><p class="helper">Select a node to view its DoD, descendants, attached TCs and evaluated solutions.</p></section><section class="card">'+details+'</section></div>';
}
function solutionCard(s){
var stats=solutionStats(s.id),checked=ui.selectedCompare.includes(s.id);
return '<article class="card solution-card"><div class="solution-title"><div class="row"><div class="solution-icon">'+E(s.name[0])+'</div><div><h3>'+E(s.name)+'</h3><span class="muted small">'+E(s.provider)+' · '+E(s.harness)+'</span></div></div>'+badge(s.accessible?"Accessible":"Not accessible")+'</div><p class="muted small">'+E(s.description)+'</p><div class="tags">'+badge(s.maturity)+s.tags.map(badge).join("")+'</div><div class="grid g2"><div><div class="stat-label">Published runs</div><strong>'+stats.count+'</strong></div><div><div class="stat-label">Observed mean score</div><strong class="score">'+(stats.count?stats.score+"/100":"Not tested")+'</strong></div></div><div class="solution-foot"><label class="small row"><input type="checkbox" data-compare="'+E(s.id)+'"'+(checked?' checked':'')+'> Compare</label>'+btn("Inspect solution →","solution",s.id,"sm")+'</div></article>';
}
function solutionsPage(){
var q=String(ui.filters.solutionSearch||"").toLowerCase(),availability=ui.filters.access||"all",maturity=ui.filters.maturity||"all";
var solutions=db.solutions.filter(function(s){return (s.name+" "+s.model+" "+s.harness+" "+s.provider+" "+s.tags.join(" ")).toLowerCase().includes(q)&&(availability==="all"||(availability==="yes"?s.accessible:!s.accessible))&&(maturity==="all"||s.maturity===maturity);});
var filters='<div class="filters"><input class="input" data-filter="solutionSearch" placeholder="Search model, harness, provider or capability…" value="'+E(ui.filters.solutionSearch||"")+'"><select data-filter="access">'+[["all","Any access"],["yes","Accessible"],["no","Not accessible"]].map(function(x){return opt(x[0],x[1],availability);}).join("")+'</select><select data-filter="maturity">'+[["all","Any maturity"],["candidate","Candidate"],["experimental","Experimental"],["evaluated","Evaluated"],["qualified","Qualified"]].map(function(x){return opt(x[0],x[1],maturity);}).join("")+'</select></div>';
var compare=ui.selectedCompare.length>=2?section("Selected solution comparison",solutionComparison(ui.selectedCompare)):'<div class="note" style="margin-top:18px">Select two or more solution cards to compare configurations, accessibility, evidence, outcomes, cost and effort side by side.</div>';
return heading("Explore","AI solution catalog","A solution is a versioned combination of model, provider, harness, configuration and capabilities. Accessible and inaccessible candidates coexist.",canEdit()?btn("+ Register solution","newSolution","","primary"):"")+filters+'<div class="grid g3">'+(solutions.length?solutions.map(solutionCard).join(""):'<div class="empty">No solutions match these filters.</div>')+'</div><div style="margin-top:20px">'+compare+'</div>';
}
function solutionComparison(ids){
var ss=ids.map(function(id){return rec("solutions",id);}).filter(Boolean);
if(!ss.length)return '<div class="empty">Select solutions to compare.</div>';
var measures=[
 ["Access",function(s){return badge(s.accessible?"Accessible":"Not accessible");}],
 ["Maturity",function(s){return badge(s.maturity);}],
 ["Model / provider",function(s){return E(s.model+" / "+s.provider);}],
 ["Harness",function(s){return E(s.harness);}],
 ["Capabilities",function(s){return E(s.skills);}],
 ["Published runs",function(s){return sRuns(s.id).length;}],
 ["Mean quality",function(s){var q=solutionStats(s.id);return q.count?'<span class="score">'+q.score+'/100</span>':'Unknown';}],
 ["Acceptance observed",function(s){var q=solutionStats(s.id);return q.count?q.accept+"%":"Unknown";}],
 ["Human effort / run",function(s){var q=solutionStats(s.id);return q.count?q.effort+" min":"Unknown";}],
 ["AI cost / run",function(s){var q=solutionStats(s.id);return q.count?money(q.cost):"Unknown";}],
 ["Declared price band",function(s){return E(s.cost);}],
 ["Known limitations",function(s){return E(s.limitations);}]
];
return '<p class="muted small" style="margin-bottom:12px">Different task mixes are not directly comparable. Use common Test Cases in the Benchmark lab for fair performance comparisons.</p>'+simpleTable(["Property"].concat(ss.map(function(s){return s.name;})),measures.map(function(row){return '<tr>'+td('<strong>'+row[0]+'</strong>')+ss.map(function(s){return td(row[1](s));}).join("")+'</tr>';}));
}
function solutionDetail(id){
var s=rec("solutions",id);if(!s)return;var rs=sRuns(id),stats=solutionStats(id),cases=new Set(rs.map(function(x){return x.case;}));
var html='<div class="grid g2">'+stat("Published runs",stats.count,cases.size+" distinct test cases")+stat("Mean result",stats.count?stats.score+"/100":"Unknown",stats.count?stats.accept+"% accepted":"No controlled evidence")+'</div><hr class="divider"><div class="tags">'+badge(s.accessible?"Accessible":"Not accessible")+badge(s.maturity)+badge(s.publication)+'</div><p style="margin-top:13px">'+E(s.description)+'</p><h3 style="margin:18px 0 8px">Recommended use</h3><div class="callout">'+E(s.recommendation)+'</div><h3 style="margin:17px 0 8px">Configuration snapshot</h3><pre class="code">'+E(s.config)+'</pre><h3 style="margin:16px 0 7px">Capabilities</h3><p>'+E(s.skills)+'</p><h3 style="margin:16px 0 7px">Limitations</h3><p class="muted">'+E(s.limitations)+'</p><h3 style="margin:18px 0 8px">Benchmark evidence</h3>'+simpleTable(["Case","Score","Accepted","Evidence"],rs.map(function(r){return '<tr>'+td(E(rec("cases",r.case)?.title||r.case))+td('<span class="score">'+r.score+'</span>')+td(badge(r.accepted?"Accepted":"Failed"))+td(btn("Inspect","runDetail",r.id,"sm"))+'</tr>';}))+(canEdit()?'<div class="inline-actions" style="margin-top:15px">'+btn("Edit solution","editSolution",id,"sm")+btn("Update recommendation","editRecommendation",id,"sm")+btn("Benchmark this solution","newRunForSolution",id,"primary sm")+'</div>':'');
openModal(s.name,html);
}
function recommendationsPage(){
var solutions=db.solutions.filter(function(s){return s.publication==="published";}),rows=solutions.map(function(s){var st=solutionStats(s.id);return '<tr>'+td(linkAction(s.name,"solution",s.id)+'<div class="muted small">'+E(s.model)+' · '+E(s.harness)+'</div>')+td('<div class="small">'+E(s.recommendation)+'</div>')+td(badge(s.accessible?"Accessible":"Not accessible")+" "+badge(s.maturity))+td(st.count?st.score+"/100 · "+st.count+" runs":"Unbenchmarked")+td(canEdit()?btn("Revise","editRecommendation",s.id,"sm"):"")+'</tr>';});
return heading("Decision support","Published recommendations","Globally shared recommendations per solution; apply task, accessibility, cost, evidence and capability filters instead of BU-specific scoreboards.",btn("Browse tasks","nav","tasks"))+section("Solution guidance",simpleTable(["Solution","Recommendation / intended fit","Properties","Evidence",""],rows))+'<div class="grid g2" style="margin-top:17px">'+section("General charters",db.guides.filter(function(g){return g.type==="Charter"&&g.status==="published";}).map(function(g){return '<div class="list-row">'+linkAction(g.title,"guideDetail",g.id)+btn("Read","guideDetail",g.id,"sm")+'</div>';}).join(""))+section("How to interpret a recommendation",'<p class="muted">Published does not mean best for every task. Check its configured harness, evidence coverage, cost, acceptance, and limitations. New Test Cases may revise previous conclusions.</p><div class="inline-actions" style="margin-top:14px">'+btn("Evidence matrix","matrix","","sm")+'</div>')+'</div>';
}
